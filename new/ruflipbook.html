  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0A0A0A;
      --gold: #C9A96E;
      --gold-dim: rgba(201,169,110,0.15);
      --text: #E8E4DF;
      --text2: #C9C1B8;
      --muted: #5F5A55;
      --border: rgba(201,169,110,0.08);
      --border2: rgba(201,169,110,0.18);
      --nav-h: 64px;
    }

    html { height: 100%; height: -webkit-fill-available; }

    body {
      height: 100%;
      height: -webkit-fill-available;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HINT ── */
    .hint {
      flex-shrink: 0;
      z-index: 10;
      text-align: center;
      padding: 7px 16px;
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 300;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(10,10,10,0.85);
      border-bottom: 1px solid var(--border);
    }

    /* ── STAGE ── */
    #stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* ── PAGE ── */
    .page {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .page.active { display: flex; animation: fadeIn 0.35s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── PAGE HEADER ── */
    .page-header {
      flex-shrink: 0;
      text-align: center;
      padding: 18px 24px 0;
      position: relative;
    }

    .page-num {
      position: absolute;
      top: 14px; right: 20px;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gold);
      opacity: 0.4;
    }

    .page-star {
      font-size: 14px;
      opacity: 0.55;
      margin-bottom: 6px;
      display: block;
    }

    .page-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.2rem, 4.5vw, 2rem);
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 5px;
    }

    .page-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2.2vw, 1rem);
      font-style: italic;
      color: var(--text2);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .page-divider {
      width: 50px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto;
    }

    /* ── PAGE BODY ── */
    .page-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 28px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dim) transparent;
    }
    .page-body::-webkit-scrollbar { width: 3px; }
    .page-body::-webkit-scrollbar-track { background: transparent; }
    .page-body::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

    /* ── TEXT CONTENT ── */
    .page-text {
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      line-height: 1.85;
      color: var(--text);
      max-width: 660px;
      margin: 0 auto;
    }

    .page-text .intro {
      text-align: center;
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      line-height: 1.9;
      margin-bottom: 20px;
      color: rgba(232,232,240,0.9);
    }

    /* Litmus line — self-identification */
    .litmus {
      text-align: center;
      font-style: italic;
      color: var(--gold);
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      line-height: 1.7;
      opacity: 0.9;
      margin: 2px auto 20px;
      max-width: 520px;
    }

    /* Quotable identity line */
    .identity {
      text-align: center;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      line-height: 1.5;
      color: var(--gold);
      font-weight: 400;
      letter-spacing: 0.5px;
      margin: 6px auto 22px;
      max-width: 560px;
    }

    /* Section labels */
    .section {
      margin-bottom: 16px;
    }

    .section-label {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.7;
      margin-bottom: 5px;
    }

    .section-text {
      font-size: clamp(0.88rem, 1.9vw, 1rem);
      line-height: 1.85;
      color: rgba(232,232,240,0.85);
    }
    .section-text b { color: var(--text); font-weight: 600; }

    /* Divider between sections */
    .section-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin: 14px 0;
    }

    /* Cover page */
    .page.cover .page-body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page.cover .page-title { font-size: clamp(1.5rem, 5.5vw, 2.6rem); }
    .page.cover .page-text  { text-align: center; }
    .page.cover .intro { font-size: clamp(1rem, 2.5vw, 1.2rem); }

    /* CTA */
    .cta-wrap { text-align: center; margin-top: 24px; }
    .cta-link {
      display: inline-block;
      padding: 12px 32px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: background 0.3s, color 0.3s;
    }
    .cta-link:hover, .cta-link:active { background: var(--gold); color: var(--bg); }

    /* Per-type micro CTA (bridge to TwinF) */
    .type-cta { text-align: center; margin: 26px auto 4px; }
    .type-cta a {
      display: inline-block;
      padding: 11px 26px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.3s, color 0.3s;
    }
    .type-cta a:hover, .type-cta a:active { background: var(--gold); color: var(--bg); }

    /* ── NAV ── */
    .nav {
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: var(--nav-h);
      padding: 0 16px env(safe-area-inset-bottom, 0px);
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(212,175,55,0.1);
    }

    .nav-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .nav-btn:hover  { background: rgba(212,175,55,0.15); box-shadow: 0 0 16px rgba(212,175,55,0.3); }
    .nav-btn:active { transform: scale(0.88); }
    .nav-btn:disabled { opacity: 0.2; cursor: default; }

    .nav-counter {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gold);
      opacity: 0.7;
      min-width: 48px;
      text-align: center;
      flex-shrink: 0;
    }

    .dots {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 200px;
    }
    .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.3;
      transition: background 0.3s, opacity 0.3s, transform 0.3s;
      flex-shrink: 0;
    }
    .dot.active { background: var(--gold); opacity: 1; transform: scale(1.6); }

    /* ── DESKTOP ── */
    @media (min-width: 600px) {
      .page-header { padding: 24px 48px 0; }
      .page-body   { padding: 20px 48px 24px; }
      .page-title  { font-size: clamp(1.4rem, 3vw, 2.2rem); }
    }
    @media (min-width: 900px) {
      .page-body { padding: 24px 100px 28px; }
    }

    /* ── LANDSCAPE MOBILE ── */
    @media (max-height: 480px) {
      .hint { display: none; }
      :root { --nav-h: 52px; }
      .page-header { padding: 10px 20px 0; }
      .page-star   { display: none; }
      .page-title  { font-size: clamp(1rem, 4vw, 1.4rem); margin-bottom: 3px; }
      .page-subtitle { margin-bottom: 6px; font-size: 0.82rem; }
      .page-divider  { display: none; }
      .page-body   { padding: 10px 20px 14px; }
      .litmus { font-size: 0.85rem; margin-bottom: 10px; }
      .identity { font-size: 1rem; margin-bottom: 12px; }
      .section-label { font-size: 8px; }
      .section-text, .page-text .intro { font-size: 0.85rem; line-height: 1.65; }
      .section { margin-bottom: 10px; }
      .section-divider { margin: 8px 0; }
      .type-cta { margin-top: 16px; }
      .nav-btn { width: 38px; height: 38px; font-size: 20px; }
    }
  </style>

<script>
const CTA = `<div class="type-cta"><a href="https://twinfrequency.io" target="_blank" rel="noopener">Найдите того, кто дополняет вашу частоту</a></div>`;

const PAGES = [
  {
    cover: true, cta: false,
    title: 'Типология Звёздных Душ',
    subtitle: 'Живая библиотека',
    star: '✦',
    html: `
      <p class="intro">Вы всегда это чувствуете. Что вы больше той жизни, в которую вас налили, и настроены на частоту, которую окружающие почему-то не слышат.</p>
      <p class="intro" style="font-style:italic; opacity:0.85;">Для таких людей есть слово. Starseed. А под этим словом двадцать четыре разные звезды, и одна из них ваша.</p>
      <p class="intro" style="opacity:0.55; letter-spacing:1px; font-family:'Inter',sans-serif; font-size:10px; text-transform:uppercase;">Листайте, пока одна из страниц не начнёт читаться как ваш дневник</p>
    `
  },
  {
    title: 'Оглавление',
    subtitle: 'Все 24 типа',
    star: '✦',
    toc: true,
    html: `<div id="toc-list"></div>`
  },
  {
    title: 'Система',
    subtitle: 'От Александры',
    star: '✦',
    about: true,
    html: `
      <p class="intro">Меня зовут Александра. Я психолог, и эта карта пришла не из учебника.</p>
      <div class="section-divider"></div>
      <div class="section">
        <div class="section-text" style="text-align:center;">Представьте воду в стакане. Она знает только ту форму, которая её держит. Вылейте эту же воду в океан: ничего не прибавилось, ничего не убыло, а масштаб того, чему она принадлежит, стал несоизмеримым. Примерно это Starseed про себя и подозревает. Та же самая вы, только океан вместо стакана.</div>
      </div>
      <div class="section">
        <div class="section-text" style="text-align:center;">Работая с людьми, я снова и снова видела, как под совершенно разными жизнями повторяется одна и та же горстка внутренних устройств. Со временем из них собралась система из двадцати четырёх. Это было похоже не на изобретение, а на узнавание того, что и так уже было.</div>
      </div>
      <div class="section">
        <div class="section-text" style="text-align:center;">Это не коробка, в которую вас кладут. Это зеркало, которое возвращает вас себе. Звезда только показывает то, чем вы уже являетесь.</div>
      </div>
    `
  },

  {
    title: 'Сириус',
    subtitle: 'Тёплое течение',
    star: '✦',
    html: `
      <p class="litmus">Если рядом с вами люди почему-то расслабляются и начинают рассказывать лишнее, эта страница про вас.</p>
      <p class="intro">Сириус самая яркая звезда ночного неба. До него восемь с половиной световых лет, и его узнают даже те, кто в звёздах не понимает ничего: выходите зимой во двор, поднимаете голову, и вот он, самый громкий.</p>
      <p class="intro">Зум до конца. Вы входите в компанию, и через минуту незнакомый человек из угла говорит с вами как со старым приятелем.</p>
      <p class="identity">Вы место, куда люди приходят греться.</p>
      <div class="section-divider"></div>
      <div class="section"><div class="section-label">Основная частота</div><div class="section-text">Ваша нота это связь. Сириус светит так, что его видно из любой точки полушария, и никаких усилий на это не тратит. Зум. <b>Люди рядом с вами выдыхают. Рассказывают то, о чём молчали годами. Уходят с ощущением, что их наконец кто-то услышал.</b> Механика простая: вы считываете не слова, а то, что под ними, и успеваете это раньше, чем начинаете думать. Стараться тут нечего. Вы просто светите.</div></div>
      <div class="section"><div class="section-label">Творческая сила</div><div class="section-text">Играете вы в желании. Сириус мерцает и переливается у горизонта, потому что свет идёт сквозь толщу воздуха: он физически не умеет стоять смирно. Зум. <b>Вы решаете среди ночи ехать к морю и поднимаете троих.</b> Живёте внутри самого движения, а не внутри плана. Желание приходит раньше расчёта и тянет за собой всех остальных. И так можете хоть до утра.</div></div>
      <div class="section"><div class="section-label">Точка роста</div><div class="section-text">Вот место, где вы втайне считаете очки. У Сириуса есть спутник, белый карлик: размером с Землю, весом с Солнце. Ложка такого вещества весит тонны. Рядом с ярким его почти не разглядеть, а систему держит именно он. Зум. <b>Вас спрашивают, вытянете ли вы этот план на самом деле, и дальше трое суток по кругу.</b> Механика простая: тепло вам досталось даром, а плотность приходится доказывать. Вам очень нужно, чтобы в вас увидели вес, а не только свет. Признаваться в этом неловко. А отпускает в тот день, когда руки строят то, что сердце и так знало.</div></div>
      <div class="section"><div class="section-label">Открытый канал</div><div class="section-text">У каждого есть место, созданное принимать. У вас это ясность. Свет Сириуса идёт к нам восемь лет по прямой, и вся его красота держится на очень простой геометрии. Зум. Кто-то раскладывает запутанное по пунктам, и узел распускается сам. <b>Где-то ходит тип, собранный ровно из этой ясности: ровный там, где вы течёте. Когда вы встретитесь, шум сядет раньше, чем ум согласится.</b></div></div>
      ${CTA}
    `
  },
  {
    title: 'Плеяды',
    subtitle: 'Чистое созвучие',
    star: '✦',
    html: `
      <p class="litmus">Если вы чувствуете, что между двумя людьми похолодало, раньше, чем они сами это замечают, эта страница про вас.</p>
      <p class="intro">Плеяды это не звезда, а толпа. Глазом видно шесть, если повезёт, семь. В бинокль их сотни, а всего там около тысячи, и вся эта компания летит сквозь галактику вместе, одной стаей.</p>
      <p class="intro">Зум до конца. Вы чувствуете настроение коллеги через весь офис и несёте его домой в собственной груди.</p>
      <p class="identity">Вы то, чем компания держится вместе.</p>
      <div class="section-divider"></div>
      <div class="section"><div class="section-label">Основная частота</div><div class="section-text">Ваша нота это связь. Плеяды держит гравитация: каждая звезда тянет остальных, и поэтому за сто миллионов лет стая ни разу не рассыпалась. Зум. <b>Вы знаете, что дружба остыла, раньше, чем это признают вслух. И тихо идёте чинить.</b> Рядом с вами людям безопасно. Механика простая: расстояние между людьми вы читаете так же, как другие читают текст.</div></div>

      <p class="intro" style="font-style:italic; opacity:0.85;">Двадцать восемь вопросов, семь минут. Отвечать надо из того места, которое знает раньше, чем начинается размышление.</p>
      <div class="cta-wrap">
        <a class="cta-link" href="https://www.starseedsoultype.com/quizru.html" target="_blank" rel="noopener">Войти в PORTAL</a>
      </div>
    `
  }
];

let cur = 0;
const stageEl = document.getElementById('stage');
const dotsEl  = document.getElementById('dots');
const curEl   = document.getElementById('cur');
const totEl   = document.getElementById('tot');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

// Build pages
PAGES.forEach((p, i) => {
  const page = document.createElement('div');
  page.className = 'page' + (p.cover ? ' cover' : '') + (i === 0 ? ' active' : '');

  const header = document.createElement('div');
  header.className = 'page-header';
  header.innerHTML = `
    <span class="page-num">${i + 1} / ${PAGES.length}</span>
    <span class="page-star">${p.star || '✦'}</span>
    <h1 class="page-title">${p.title}</h1>
    <p class="page-subtitle">${p.subtitle}</p>
    <div class="page-divider"></div>
  `;

  const body = document.createElement('div');
  body.className = 'page-body';

  const text = document.createElement('div');
  text.className = 'page-text';
  text.innerHTML = p.html;

  body.appendChild(text);
  page.appendChild(header);
  page.appendChild(body);
  stageEl.appendChild(page);
});

// Build TOC dynamically
const tocListEl = document.getElementById('toc-list');
if (tocListEl) {
  // Find indices of Starseed type pages (skip cover, toc, about, cta)
  const soulTypes = PAGES
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => !p.cover && !p.toc && !p.cta && !p.about);

  const tocHTML = soulTypes.map(({ p, i }) => {
    const num = i + 1;
    return `<div class="toc-item" onclick="show(${i})" style="
      display:flex; justify-content:space-between; align-items:center;
      padding: 7px 0; border-bottom: 1px solid rgba(255,215,0,0.1);
      cursor:pointer; transition: color 0.2s;
    ">
      <span style="color: var(--gold); font-family:'Cormorant Garamond',serif; font-size:1.05rem; letter-spacing:0.5px;">${p.title}<span style="color:rgba(232,232,240,0.4); font-style:italic; font-size:0.85rem;"> &middot; ${p.subtitle}</span></span>
      <span style="color: rgba(232,232,240,0.4); font-size:0.8rem; font-family:'Inter',sans-serif; letter-spacing:1px;">${num}</span>
    </div>`;
  }).join('');

  tocListEl.innerHTML = `
    <div style="font-size:0.75rem; letter-spacing:2px; color:rgba(232,232,240,0.4); font-family:'Inter',sans-serif; text-transform:uppercase; margin-bottom:12px;">Нажмите на имя, чтобы перейти сразу</div>
    ${tocHTML}
  `;
}

// Build dots
PAGES.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  dotsEl.appendChild(d);
});

totEl.textContent = PAGES.length;
prevBtn.disabled = true;

function show(idx) {
  const pages = stageEl.querySelectorAll('.page');
  const dots  = dotsEl.querySelectorAll('.dot');
  pages[cur].classList.remove('active');
  dots[cur].classList.remove('active');
  cur = idx;
  pages[cur].classList.add('active');
  dots[cur].classList.add('active');
  const body = pages[cur].querySelector('.page-body');
  if (body) body.scrollTop = 0;
  curEl.textContent = cur + 1;
  prevBtn.disabled  = cur === 0;
  nextBtn.disabled  = cur === PAGES.length - 1;
}

function go(dir) {
  const n = cur + dir;
  if (n >= 0 && n < PAGES.length) show(n);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});

// Touch swipe
let tx = 0, ty = 0, swiping = false;
document.addEventListener('touchstart', e => {
  tx = e.changedTouches[0].clientX;
  ty = e.changedTouches[0].clientY;
  swiping = false;
}, { passive: true });
document.addEventListener('touchmove', e => {
  const dx = Math.abs(e.changedTouches[0].clientX - tx);
  const dy = Math.abs(e.changedTouches[0].clientY - ty);
  if (dx > dy && dx > 12) swiping = true;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!swiping) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
}, { passive: true });
</script>
</body>
</html>
