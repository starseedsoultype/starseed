<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --cream: #F2ECE3;
  --card: #FFFFFF;
  --ink: #111111;
  --ink2: #55524D;
  --ink3: #8A857E;
  --line: rgba(17,17,17,0.12);
  --accent2: #111111;
  --grad: linear-gradient(135deg,#3E6FC4 0%,#9B8CD6 30%,#E6A6C8 55%,#F6B8A8 75%,#F5CD6A 100%);
}
html { background: var(--cream); }
body {
  background: var(--cream); color: var(--ink);
  font-family: 'Onest', system-ui, -apple-system, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 0 16px 80px; -webkit-font-smoothing: antialiased;
}
.grad-bg { position: absolute; inset: 0; background: var(--grad); overflow: hidden; }
.grad-bg::after {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(40% 35% at 20% 70%, rgba(62,111,196,.8), transparent 70%),
    radial-gradient(45% 40% at 80% 20%, rgba(245,205,106,.8), transparent 70%),
    radial-gradient(50% 45% at 70% 75%, rgba(242,169,198,.8), transparent 70%);
  filter: blur(30px); animation: breathe 9s ease-in-out infinite alternate;
}
@keyframes breathe { to { transform: translate(4%,-3%) scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .grad-bg::after { animation: none; } }

.progress-wrap {
  width: 100%; max-width: 640px; position: sticky; top: 0; background: var(--cream);
  z-index: 10; padding: 20px 0 14px; display: none;
}
.progress-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--ink); margin-bottom: 10px; }
.progress-bg { width: 100%; height: 4px; background: rgba(17,17,17,.08); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--grad); border-radius: 4px; transition: width .4s ease; }

#intro {
  position: relative; width: calc(100% + 32px); margin: 0 -16px; min-height: 100svh;
  display: flex; flex-direction: column; overflow: hidden;
}
.intro-in { position: relative; flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 560px; margin: 0 auto; padding: 28px 24px 40px; }
.intro-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; }
.intro-main { margin-top: auto; }
.intro-title { font-weight: 900; font-size: clamp(52px, 15vw, 84px); line-height: .92; letter-spacing: -.035em; }
.intro-sub { font-weight: 300; font-size: 22px; line-height: 1.1; margin: 14px 0 28px; }
.intro-body { font-size: 16px; line-height: 1.5; margin-bottom: 26px; max-width: 440px; }
.start-btn, .bot-btn {
  display: block; width: 100%; text-align: center; background: var(--ink); color: #fff; border: 0;
  border-radius: 999px; padding: 17px; font-family: inherit; font-weight: 600; font-size: 15px;
  cursor: pointer; text-decoration: none; transition: transform .15s;
}
.start-btn:active, .bot-btn:active { transform: scale(.98); }
.intro-note { font-size: 13px; text-align: center; margin-top: 12px; }

#quiz { max-width: 640px; width: 100%; padding-top: 14px; display: none; }
.q-block { animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.q-num { font-size: 12px; font-weight: 500; letter-spacing: .06em; color: var(--ink2); text-transform: uppercase; margin-bottom: 10px; }
.q-text { font-weight: 800; font-size: clamp(22px, 6vw, 28px); line-height: 1.15; letter-spacing: -.02em; margin-bottom: 22px; }

.opts-force4, .opts-binary { display: flex; flex-direction: column; gap: 10px; }
.opt-btn, .ml2-btn {
  width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 15px 16px; text-align: left; cursor: pointer; font-family: inherit; font-size: 16px;
  line-height: 1.4; color: var(--ink); position: relative; transition: all .2s;
}
.opt-btn:hover, .ml2-btn:hover { border-color: rgba(17,17,17,.3); }
.opt-btn:active, .ml2-btn:active { transform: scale(.99); }
.opt-btn.selected { background: var(--grad); border-color: transparent; font-weight: 500; }

.ml-step { font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 14px; padding: 10px; border-radius: 12px; background: rgba(17,17,17,.06); }
.opts-ml2 { display: flex; flex-direction: column; gap: 10px; }
.ml2-btn { padding-right: 16px; }
.ml2-btn.is-most { background: var(--grad); border-color: transparent; font-weight: 500; padding-bottom: 34px; }
.ml2-btn.is-most::after { content: '✦ больше всего'; position: absolute; left: 16px; bottom: 10px; font-size: 12px; font-weight: 600; }
.ml2-btn.is-least { background: #E4DED5; border-color: transparent; color: var(--ink2); padding-bottom: 34px; }
.ml2-btn.is-least::after { content: '✕ меньше всего'; position: absolute; left: 16px; bottom: 10px; font-size: 12px; font-weight: 600; }
.ml2-btn.is-disabled { opacity: .45; cursor: default; }

.rank-instruction { font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 14px; }
.opts-rank { display: flex; flex-direction: column; gap: 10px; }
.rank-item { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 12px 12px 12px 14px; border-radius: 16px; transition: all .2s; }
.rank-item.rank-selected { border-color: var(--ink); }
.rank-num { width: 30px; height: 30px; border-radius: 50%; background: var(--grad); color: var(--ink); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rank-text { font-size: 15px; line-height: 1.4; flex: 1; }
.rank-item.rank-unset .rank-num { background: rgba(17,17,17,.08); color: var(--ink3); }
.rank-arrows { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.rank-arrow { width: 44px; height: 40px; background: var(--cream); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-tap-highlight-color: transparent; }
.rank-arrow:active { background: #E4DED5; }
.rank-arrow:disabled { opacity: .25; pointer-events: none; }

.nav-row { display: flex; gap: 10px; align-items: center; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.nav-back { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 15px 22px; cursor: pointer; font-family: inherit; font-weight: 500; font-size: 15px; border-radius: 999px; }
.nav-back:disabled { opacity: .3; pointer-events: none; }
.nav-next { flex: 1; background: var(--ink); border: 0; color: #fff; padding: 16px 24px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 15px; border-radius: 999px; transition: opacity .2s; }
.nav-next:disabled { opacity: .25; cursor: not-allowed; }

#result { max-width: 640px; width: 100%; display: none; }
.poster { position: relative; width: calc(100% + 32px); margin: 0 -16px; min-height: 64svh; border-radius: 0 0 28px 28px; overflow: hidden; display: flex; }
.poster-in { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 24px; max-width: 640px; margin: 0 auto; width: 100%; }
.poster-top, .poster-foot { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; }
.poster-name { font-weight: 900; font-size: clamp(48px, 16vw, 96px); line-height: .92; letter-spacing: -.04em; word-break: break-word; }
.poster-label { font-weight: 300; font-size: 22px; margin-top: 12px; }
.res { padding: 26px 0 0; }
.res-text { font-size: 17px; line-height: 1.45; margin-bottom: 20px; }
.save-btn { display: block; width: 100%; margin-top: 10px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 16px; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
.retake-btn { display: block; margin: 22px auto 0; background: none; border: 0; color: var(--ink2); font-family: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }
</style>

<script>



// ── QUESTIONS ──────────────────────────────────────────────────────────────
const QUESTIONS = [
  {
    id:1, type:"force4",
    text:"Вы пришли в компанию, где уже идёт важный разговор. Что вы замечаете первым?",
    opts:[
      { text:"Что здесь есть по делу: деньги, ресурсы, кто что реально может." },
      { text:"Логику спора: где аргументы держатся, а где дыра." },
      { text:"Людей: кто на кого обижен, кто кому нравится, о чём молчат." },
      { text:"Энергию: кто здесь горит, кто уже сдулся. И чего хотите вы сами." },
    ]
  },
  {
    id:2, type:"force4",
    text:"Новый знакомый рассказывает о чём-то важном для себя. Что вы понимаете о нём уже через пару минут?",
    opts:[
      { text:"Где в его рассказе не сходится логика. Он эту трещину ещё не видит, а вы уже видите." },
      { text:"Что ему на самом деле нужно от разговора, кроме того, о чём он просит." },
      { text:"Хочет ли он правда что-то менять или в глубине держится за то, что есть." },
      { text:"Какое одно конкретное дело он откладывает. Именно оно изменило бы всё." },
    ]
  },
  {
    id:3, type:"force4",
    text:"В группе всё пошло не так: люди потеряли направление, никто не знает, что делать. Вас ни о чём не просили. Что вы видите первым?",
    opts:[
      { text:"Что конкретно сломалось, чего не хватает и какое действие это починит." },
      { text:"Кто источник напряжения и что сейчас нужно каждому." },
      { text:"В каком месте план дал сбой и как из этого выйти." },
      { text:"Где пропал огонь и какая цель снова зажжёт людей." },
    ]
  },
  {
    id:4, type:"force4",
    text:"Что вам всегда давалось само, хотя другие этому долго учатся? Про что вы думаете: «А разве этому надо учиться?»",
    opts:[
      { text:"Понимать, чего я хочу. Люди ищут это годами, а мне это всегда было ясно." },
      { text:"Чувствовать людей. Что человек имеет в виду на самом деле, я слышу сразу." },
      { text:"Видеть, как всё устроено. Выдержит ли план, сходится ли аргумент." },
      { text:"Справляться с деньгами, телом, бытом. Спокойно, без лишней тревоги." },
    ]
  },
  {
    id:5, type:"force4",
    text:"Группа никак не может принять решение. Вы уже видите, что все обходят стороной. Что это обычно?",
    opts:[
      { text:"Реальные факты: сколько денег, времени и сил есть на самом деле." },
      { text:"Чего люди на самом деле хотят. Пока это не назовут вслух, ничего не сдвинется." },
      { text:"Кто кому доверяет и где настоящее напряжение между людьми." },
      { text:"Ошибку в рассуждении, из-за которой разговор ходит по кругу." },
    ]
  },
  {
    id:6, type:"force4",
    text:"Незнакомый человек вдруг кажется вам «своим». Что вас в нём зацепило?",
    opts:[
      { text:"Как легко он справляется с делами, будто это ничего не стоит." },
      { text:"Как точно он думает и говорит." },
      { text:"Как он сразу почувствовал, что происходит между людьми." },
      { text:"Какой он живой, сколько в нём желания." },
    ]
  },
  {
    id:7, type:"force4",
    text:"Что вы умеете с детства так естественно, что даже не считаете это умением?",
    opts:[
      { text:"Чувствовать, что происходит между людьми. Даже когда все молчат." },
      { text:"Знать, куда мне хочется. Желание приходит раньше любых раздумий." },
      { text:"Уверенно жить в материальном мире: тело, деньги, практические дела." },
      { text:"Сразу видеть, где в идее или плане слабое место." },
    ]
  },
  {
    id:8, type:"force4",
    text:"Иногда тело понимает раньше головы. Что вы обычно чувствуете «нутром» первым?",
    opts:[
      { text:"Что-то не сходится. Внутри щёлкает, хотя я ещё не знаю, что именно." },
      { text:"Кто здесь настоящий, а кто играет роль." },
      { text:"Что в ситуации надёжно, а что вот-вот развалится." },
      { text:"Куда всё это хочет двигаться и есть ли здесь живая энергия." },
    ]
  },
  {
    id:9, type:"most_least",
    text:"Что вы приносите с собой, куда бы ни пришли? Выберите самое похожее на вас и самое непохожее.",
    opts:[
      { text:"Тепло. Рядом со мной люди чувствуют, что их правда видят." },
      { text:"Энергию. Рядом со мной всё начинает двигаться." },
      { text:"Опору. Рядом со мной людям спокойно и надёжно." },
      { text:"Ясность. Рядом со мной запутанное становится понятным." },
    ]
  },
  {
    id:10, type:"most_least",
    text:"С чем люди уходят после разговора с вами? Выберите самое частое и самое редкое.",
    opts:[
      { text:"С чувством, что их поняли глубже, чем они ожидали." },
      { text:"Более живыми и заряженными, чем пришли." },

  },
  {

    text:"Зачем вам обычно звонят? Выберите самое подходящее и самое непохожее.",

    ]
  },
  {
    id:12, type:"most_least",
    text:"Какая сила ваша? Выберите самую близкую и самую далёкую.",
    opts:[
      { text:"Создавать настоящий контакт с человеком." },
      { text:"Заражать своим желанием, так что другие тоже загораются." },
      { text:"Воплощать: превращать идею в реальную вещь." },
      { text:"Находить порядок в хаосе и объяснять его другим." },
    ]
  },
  {
    id:13, type:"most_least",
    text:"Когда вы больше всего чувствуете себя собой? Выберите самое близкое и самое далёкое.",
    opts:[
      { text:"Когда разговор ушёл туда, куда никто не планировал, и прозвучало что-то настоящее." },
      { text:"Когда точно знаю, чего хочу, иду к этому, и всё остальное отступает." },
      { text:"Когда вижу результат своего труда и знаю, что он надёжен." },
      { text:"Когда наконец понимаю то, что раньше было неясно, и всё встаёт на место." },
    ]
  },
  {
    id:14, type:"most_least",
    text:"Какой дар был в вас с самого начала, а какой кажется самым чужим?",
    opts:[
      { text:"Дар близости: создавать настоящие встречи между людьми." },
      { text:"Дар живости: напоминать другим, чего они хотят на самом деле." },
      { text:"Дар земли: уверенно жить в теле и в реальном мире." },
      { text:"Дар ясности: видеть, что работает, а что нет, и говорить об этом." },
    ]
  },
  {
    id:15, type:"force4",
    text:"К какой теме вас тянет снова и снова? Вы видите чужие ошибки и знаете, как лучше.",

      { text:"Отношения. Что на самом деле нужно любви и какой бывает настоящая близость." },

    id:16, type:"force4",

    text:"Какой вопрос возвращается в вашу жизнь снова и снова, в самых разных обстоятельствах?",

      { text:"Как построить что-то надёжное и что на самом деле нужно моему телу?" },

  {

// ── СОСТОЯНИЕ ──────────────────────────────────────────────────────────────
let current = 0;
let answers = {};
let tbQueue = [];

// ── ПРОИСХОЖДЕНИЕ ─────────────────────────────────────────────────────────
// Ответы уходят на сервер как есть; он либо задаёт ещё один вопрос, либо возвращает Origin.
const _SCAN_URL = 'https://pewgupxikbswhaqxjrwk.supabase.co/functions/v1/origin-scan';
let resolvedType = null;
let scanBusy = false;
async function scanServer(payload){
  const r = await fetch(_SCAN_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  if(!r.ok) throw new Error('scan failed');
  return await r.json();
}

function calculateResult() {
  if (scanBusy) return;
  scanBusy = true;
  const qa = {}, tb = {};
  QUESTIONS.forEach(q => { qa[q.id] = answers[q.id]; });
  tbQueue.forEach(t => { if (answers[t.id] !== undefined) tb[t.id] = answers[t.id]; });
  scanServer({ quiz: 'ru', answers: qa, tb: tb }).then(function(r){
    scanBusy = false;
    if (r.ask) {
      tbQueue.push({ id: r.ask.id, type: "binary", text: r.ask.text, opts: r.ask.opts.map(x => ({ text: x })) });
      renderTB();
      return;
    }
    resolvedType = r.result;
    showResult();
  }).catch(function(){ scanBusy = false; alert('Портал мигнул. Проверьте соединение и попробуйте ещё раз.'); });
}

function getType() { return resolvedType; }

// ── ДВИЖОК КВИЗА ────────────────────────────────────────────────────────────
function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  updateProgress();
  const quizEl = document.getElementById('quiz');

  let html = `<div class="q-block">
    <div class="q-num">Вопрос ${current + 1} из ${QUESTIONS.length}</div>
    <div class="q-text">${q.text}</div>`;

  if (q.type === "force4") {
    html += `<div class="opts-force4">`;
    q.opts.forEach((opt, i) => {
      const sel = answers[q.id] === i ? 'selected' : '';
      html += `<button class="opt-btn ${sel}" onclick="selectForce4(${q.id}, ${i})">${opt.text}</button>`;
    });
    html += `</div>`;
  }
  else if (q.type === "most_least") {
    const saved = answers[q.id] || { most: null, least: null };
    const hasMost = saved.most !== null;
    const hasLeast = saved.least !== null;

    let stepText = '';
    if (!hasMost) stepText = 'Шаг 1 из 2. Выберите то, что БОЛЬШЕ ВСЕГО похоже на вас';
    else if (!hasLeast) stepText = 'Шаг 2 из 2. Выберите то, что МЕНЬШЕ ВСЕГО похоже на вас';
    else stepText = 'Оба выбраны — нажми любой, чтобы изменить';

    html += `<div class="ml-step">${stepText}</div>
    <div class="opts-ml2">`;
    q.opts.forEach((opt, i) => {
      const isMost = saved.most === i;
      const isLeast = saved.least === i;
      let cls = 'ml2-btn';
      if (isMost) cls += ' is-most';
      else if (isLeast) cls += ' is-least';
      html += `<button class="${cls}" onclick="selectML2(${q.id}, ${i})">${opt.text}</button>`;
    });
    html += `</div>`;
  }
  else if (q.type === "ranking") {
    const saved = answers[q.id];
    const order = saved || q.opts.map((_, i) => i);
    const isConfirmed = !!saved;
    html += `<div class="rank-instruction">Расставьте стрелками: самое похожее наверху</div>
    <div class="opts-rank" id="rankList">`;
    order.forEach((optIdx, pos) => {
      html += `<div class="rank-item" data-idx="${optIdx}" data-pos="${pos}">
        <div class="rank-num">${pos + 1}</div>
        <div class="rank-text">${q.opts[optIdx].text}</div>
        <div class="rank-arrows">
          <button class="rank-arrow" onclick="moveRank(${q.id}, ${pos}, -1)" ${pos === 0 ? 'disabled' : ''}>↑</button>
          <button class="rank-arrow" onclick="moveRank(${q.id}, ${pos}, 1)" ${pos === order.length - 1 ? 'disabled' : ''}>↓</button>
        </div>
      </div>`;
    });
    html += `</div>`;
    if (!isConfirmed) {
      html += `<div style="margin-top:12px">
        <button class="nav-next" style="width:100%" onclick="confirmRanking(${q.id})">Подтвердить этот порядок</button>
      </div>`;
    }
  }

  const isAnswered = isQuestionAnswered(q);
  const isLast = current === QUESTIONS.length - 1;
  const hideNavNext = q.type === "ranking" && !isAnswered;

  html += `<div class="nav-row">
    <button class="nav-back" onclick="goBack()" ${current === 0 ? 'disabled' : ''}>Назад</button>
    <button class="nav-next" onclick="goNext()" ${isAnswered && !hideNavNext ? '' : 'disabled'} ${hideNavNext ? 'style="display:none"' : ''} id="nextBtn">
      ${isLast ? 'Узнать моё происхождение' : 'Продолжить'}
    </button>
  </div></div>`;

  quizEl.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTB() {
  const tb = tbQueue[tbQueue.length - 1];
  const quizEl = document.getElementById('quiz');
  const tbLabel = 'Ещё один вопрос, и ваше происхождение раскроется';
  document.getElementById('progressText').textContent = 'Почти готово';

  let html = `<div class="q-block">
    <div class="q-num" style="color:var(--accent2)">${tbLabel}</div>
    <div class="q-text">${tb.text}</div>
    <div class="opts-binary">`;
  tb.opts.forEach((opt, i) => {
    const sel = answers[tb.id] === i ? 'selected' : '';
    html += `<button class="opt-btn ${sel}" onclick="selectTB('${tb.id}', ${i})">${opt.text}</button>`;
  });
  html += `</div>
    <div class="nav-row">
      <button class="nav-back" onclick="goBackFromTB()">Назад</button>
      <button class="nav-next" onclick="finishTB()" ${answers[tb.id] !== undefined ? '' : 'disabled'} id="nextBtn">
        Раскрыть моё происхождение
      </button>
    </div></div>`;

  quizEl.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function isQuestionAnswered(q) {
  if (q.type === "most_least") {
    const a = answers[q.id];
    return a && a.most !== null && a.least !== null && a.most !== a.least;
  }
  if (q.type === "ranking") return answers[q.id] !== undefined;
  return answers[q.id] !== undefined && answers[q.id] !== null;
}

function selectForce4(qId, idx) {
  answers[qId] = idx;
  renderQuestion();
}

function selectML2(qId, idx) {
  if (!answers[qId]) answers[qId] = { most: null, least: null };
  const a = answers[qId];
  if (a.most === idx) { a.most = null; a.least = null; renderQuestion(); return; }
  if (a.least === idx) { a.least = null; renderQuestion(); return; }
  if (a.most === null) { a.most = idx; renderQuestion(); return; }
  if (a.least === null && idx !== a.most) { a.least = idx; renderQuestion(); return; }
  if (idx !== a.most) { a.least = idx; renderQuestion(); }
}

function selectTB(tbId, idx) {
  answers[tbId] = idx;
  renderTB();
}

function finishTB() {
  calculateResult();
}

function goNext() {
  const q = QUESTIONS[current];
  if (!isQuestionAnswered(q)) return;
  if (current === QUESTIONS.length - 1) {
    calculateResult();
    return;
  }
  current++;
  renderQuestion();
}

function goBackFromTB() {
  const tb = tbQueue[tbQueue.length - 1];
  if (tb) delete answers[tb.id];
  tbQueue.pop();
  current = QUESTIONS.length - 1;
  document.getElementById('progressText').textContent = `${QUESTIONS.length} / ${QUESTIONS.length}`;
  document.getElementById('progressFill').style.width = '100%';
  renderQuestion();
}

function goBack() {
  if (current > 0) { current--; renderQuestion(); }
}

function updateProgress() {
  const pct = Math.round((current / QUESTIONS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${current + 1} / ${QUESTIONS.length}`;
}

function confirmRanking(qId) {
  const q = QUESTIONS.find(q => q.id === qId);
  if (!answers[qId]) answers[qId] = q.opts.map((_, i) => i);
  renderQuestion();
}

function moveRank(qId, pos, dir) {
  const q = QUESTIONS.find(q => q.id === qId);
  const order = answers[qId] ? [...answers[qId]] : q.opts.map((_, i) => i);
  const newPos = pos + dir;
  if (newPos < 0 || newPos >= order.length) return;
  [order[pos], order[newPos]] = [order[newPos], order[pos]];
  answers[qId] = order;
  renderQuestion();
}

// Story image 1080×1920: gradient, Origin name, label, site
async function saveStory(name, dateStr) {
  try { await document.fonts.load('900 160px Onest'); await document.fonts.load('300 60px Onest'); } catch (e) {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H);
  [['#3E6FC4',0],['#9B8CD6',.3],['#E6A6C8',.55],['#F6B8A8',.75],['#F5CD6A',1]].forEach(([col, st]) => g.addColorStop(st, col));
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  [[220,1350,700,'rgba(62,111,196,.55)'],[860,380,650,'rgba(245,205,106,.55)'],[760,1450,750,'rgba(242,169,198,.55)']].forEach(([cx, cy, r, col]) => {
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r); rg.addColorStop(0, col); rg.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
    x.fillStyle = rg; x.fillRect(0, 0, W, H);
  });
  x.fillStyle = '#111';
  x.font = '500 40px Onest, sans-serif'; x.textBaseline = 'top';
  x.fillText(dateStr, 80, 110);
  x.textAlign = 'right'; x.fillText('StarSeedSoul', W - 80, 110); x.textAlign = 'left';
  // fit the name: up to two lines, largest size that fits
  const words = name.split(' ');
  let size = 220, lines;
  for (; size > 80; size -= 6) {
    x.font = `900 ${size}px Onest, sans-serif`;
    lines = words.length > 1 && x.measureText(name).width > W - 160 ? [words.slice(0, Math.ceil(words.length / 2)).join(' '), words.slice(Math.ceil(words.length / 2)).join(' ')] : [name];
    if (lines.every(l => x.measureText(l).width <= W - 160)) break;
  }
  x.textBaseline = 'alphabetic';
  const lh = size * .92, base = 1180 - (lines.length - 1) * lh;
  lines.forEach((l, i) => x.fillText(l, 80, base + i * lh));
  x.font = '300 64px Onest, sans-serif'; x.fillText('мой звёздный тип', 80, base + (lines.length - 1) * lh + 100);
  x.font = '500 40px Onest, sans-serif'; x.fillText('starseedsoultype.com', 80, H - 120);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], 'starseed-' + (ORIGIN_SLUGS[name] || 'type') + '.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function drawCrystal(c){
  const canvas=document.getElementById('resCrystal');if(!canvas||!c)return;
  const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,90);
  bg.addColorStop(0,c.bg);bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  c.tris.forEach(([x0,y0,x1,y1,x2,y2,c0,c1,st])=>{
    ctx.save();ctx.globalCompositeOperation='screen';
    const grad=ctx.createLinearGradient(x0,y0,x2,y2);
    grad.addColorStop(0,c0);grad.addColorStop(1,c1);
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle=st;ctx.lineWidth=0.8;ctx.stroke();ctx.restore();
  });
  const e=c.edge;
  ctx.save();ctx.globalCompositeOperation='screen';
  ctx.beginPath();ctx.moveTo(e[0],e[1]);ctx.lineTo(e[2],e[3]);ctx.lineTo(e[4],e[5]);ctx.lineTo(e[6],e[7]);ctx.closePath();
  ctx.strokeStyle=e[8];ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
  ctx.save();ctx.globalCompositeOperation='screen';
  c.dots.forEach(([x,y,gr,glowCol,sz,fill])=>{
    const glow=ctx.createRadialGradient(x,y,0,x,y,gr);
    glow.addColorStop(0,glowCol);glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,gr,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
  });
  ctx.restore();
  const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,10);
