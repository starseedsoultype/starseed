* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #07050f;
  --bg2: #0e0820;
  --bg3: #130d22;
  --border: #221133;
  --border2: #332244;
  --text: #f0eaff;
  --text2: #ccbbdd;
  --text3: #9988aa;
  --text4: #7766aa;
  --accent: #9966cc;
  --accent2: #bb88ff;
  --gold: #d4a843;
  --green: #44cc88;
  --red: #ff5544;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Georgia', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px 80px;
}

.progress-wrap {
  width: 100%; max-width: 640px;
  position: sticky; top: 0;
  background: var(--bg);
  z-index: 10;
  padding: 20px 0 16px;
  display: none;
}
.progress-meta {
  display: flex; justify-content: space-between;
  font-size: 10px; letter-spacing: 2px; color: var(--text4);
  text-transform: uppercase; margin-bottom: 8px;
}
.progress-bg { width: 100%; height: 2px; background: var(--bg3); border-radius: 1px; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #553388, #9966cc);
  border-radius: 1px; transition: width 0.4s ease;
}

#intro {
  max-width: 560px; width: 100%;
  text-align: center; padding-top: 80px;
}
.eyebrow { font-size: 10px; letter-spacing: 5px; color: var(--text4); text-transform: uppercase; margin-bottom: 16px; }
.intro-title { font-size: 28px; color: var(--text); letter-spacing: 2px; margin-bottom: 16px; font-weight: normal; }
.intro-body { font-size: 14px; color: var(--text3); line-height: 1.9; margin-bottom: 12px; }
.divider { width: 60px; height: 1px; background: var(--border2); margin: 28px auto; }
.intro-note { font-size: 11px; color: var(--text4); letter-spacing: 1px; margin-bottom: 40px; font-style: italic; }
.start-btn {
  padding: 14px 48px; border: 1px solid var(--accent);
  background: var(--bg3); color: var(--accent2);
  font-family: Georgia, serif; font-size: 13px; letter-spacing: 3px;
  text-transform: uppercase; cursor: pointer; border-radius: 2px;
  transition: all 0.2s;
}
.start-btn:hover { background: #1a0a2e; border-color: var(--accent2); }

#quiz { max-width: 640px; width: 100%; padding-top: 20px; display: none; }

.q-block { animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.q-num { font-size: 9px; letter-spacing: 3px; color: var(--text4); text-transform: uppercase; margin-bottom: 14px; }
.q-text { font-size: 17px; color: var(--text); line-height: 1.8; margin-bottom: 28px; font-style: italic; }

.opts-force4 { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  background: var(--bg2); border: 1px solid var(--border);
  padding: 16px 18px; text-align: left; cursor: pointer;
  font-family: Georgia, serif; font-size: 13px; color: var(--text2);
  line-height: 1.65; border-radius: 3px; transition: all 0.2s;
  position: relative;
}
.opt-btn:hover { border-color: var(--accent); color: var(--text); background: var(--bg3); }
.opt-btn:active { border-color: var(--accent2); background: #1a0a2e; transform: scale(0.99); }
.opt-btn.selected { border-color: var(--accent2); color: var(--text); background: #1a0a2e; }
.opt-btn.selected::after {
  content: '✦'; position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%); color: var(--accent2); font-size: 12px;
}

.ml-step {
  font-size: 11px; letter-spacing: 2px; color: var(--accent2);
  text-transform: uppercase; margin-bottom: 14px; text-align: center;
  padding: 8px; background: var(--bg3); border-radius: 3px;
  border: 1px solid var(--border2);
}
.opts-ml2 { display: flex; flex-direction: column; gap: 8px; }
.ml2-btn {
  width: 100%; padding: 16px 18px; text-align: left; cursor: pointer;
  font-family: Georgia, serif; font-size: 13px; color: var(--text2);
  line-height: 1.65; border-radius: 3px; transition: all 0.2s;
  position: relative; border: 1px solid var(--border);
  background: var(--bg2);
}
.ml2-btn:hover { border-color: var(--border2); }
.ml2-btn:active { background: var(--bg3); transform: scale(0.99); }
.ml2-btn.is-most {
  border-color: var(--green); background: #041208; color: var(--text);
}
.ml2-btn.is-most::after {
  content: '✦ БОЛЬШЕ ВСЕГО'; position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); color: var(--green);
  font-size: 10px; letter-spacing: 2px;
}
.ml2-btn.is-least {
  border-color: var(--red); background: #120404; color: var(--text);
}
.ml2-btn.is-least::after {
  content: '✕ МЕНЬШЕ ВСЕГО'; position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); color: var(--red);
  font-size: 10px; letter-spacing: 2px;
}
.ml2-btn.is-disabled { opacity: 0.4; cursor: default; }

.rank-instruction {
  font-size: 10px; letter-spacing: 2px; color: var(--text4);
  text-transform: uppercase; margin-bottom: 16px;
}
.opts-rank { display: flex; flex-direction: column; gap: 8px; }
.rank-item {
  display: flex; gap: 10px; align-items: center;
  background: var(--bg2); border: 1px solid var(--border);
  padding: 12px 14px; border-radius: 3px;
  transition: all 0.2s;
}
.rank-item.rank-selected { border-color: var(--accent2); background: #1a0a2e; }
.rank-num {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--border2); color: var(--accent2);
  font-size: 12px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; background: var(--bg3);
}
.rank-text { font-size: 13px; color: var(--text2); line-height: 1.5; flex: 1; }
.rank-item.rank-unset { border-color: var(--border2); }
.rank-item.rank-unset .rank-num { color: var(--text4); border-color: var(--border); }
.rank-arrows { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.rank-arrow {
  width: 44px; height: 44px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 3px;
  color: var(--text4); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; user-select: none; -webkit-tap-highlight-color: transparent;
}
.rank-arrow:hover { border-color: var(--accent); color: var(--accent2); }
.rank-arrow:active { background: var(--bg2); color: var(--accent2); }
.rank-arrow:disabled { opacity: 0.2; pointer-events: none; }

.opts-binary { display: flex; flex-direction: column; gap: 10px; }

.nav-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border);
}
.nav-back {
  background: transparent; border: 1px solid var(--border);
  color: var(--text4); padding: 10px 20px; cursor: pointer;
  font-family: Georgia, serif; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; border-radius: 2px; transition: all 0.2s;
}
.nav-back:hover { border-color: var(--border2); color: var(--text3); }
.nav-back:disabled { opacity: 0.2; pointer-events: none; }
.nav-next {
  background: var(--bg3); border: 1px solid var(--accent);
  color: var(--accent2); padding: 12px 28px; cursor: pointer;
  font-family: Georgia, serif; font-size: 12px; letter-spacing: 3px;
  text-transform: uppercase; border-radius: 2px; transition: all 0.2s;
}
.nav-next:hover { background: #1a0a2e; border-color: var(--accent2); }
.nav-next:disabled { opacity: 0.3; cursor: not-allowed; }

#result { max-width: 640px; width: 100%; display: none; padding-top: 40px; }
.result-eyebrow { text-align: center; font-size: 10px; letter-spacing: 5px; color: var(--text4); text-transform: uppercase; margin-bottom: 16px; }
.result-crystal { display: flex; justify-content: center; margin-bottom: 24px; }
.result-subtitle { font-size: 11px; color: var(--text4); letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 32px; }
.result-origin { font-size: 32px; letter-spacing: 2px; text-align: center; margin-bottom: 6px; font-style: italic; }

.preview-box {
  background: var(--bg2); border: 1px solid var(--border2);
  padding: 28px; border-radius: 4px; margin-bottom: 24px;
}
.preview-box h2 { font-size: 10px; letter-spacing: 4px; color: var(--text4); text-transform: uppercase; margin-bottom: 20px; text-align: center; }
.preview-section { margin-bottom: 20px; }
.preview-label { font-size: 9px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
.preview-text { font-size: 14px; color: var(--text2); line-height: 1.9; }
.preview-blurred { filter: blur(5px); user-select: none; -webkit-user-select: none; pointer-events: none; color: var(--text3); }

.unlock-box {
  background: linear-gradient(135deg, #0e0820, #1a0a2e);
  border: 1px solid var(--accent); padding: 32px 24px;
  border-radius: 4px; text-align: center; margin-bottom: 24px;
}
.unlock-title { font-size: 22px; color: var(--text); letter-spacing: 1px; margin-bottom: 8px; font-style: italic; }
.unlock-sub { font-size: 13px; color: var(--text3); line-height: 1.7; margin-bottom: 24px; }
.unlock-list { text-align: left; margin-bottom: 28px; display: flex; flex-direction: column; gap: 8px; }
.unlock-item { font-size: 12px; color: var(--text2); display: flex; align-items: flex-start; gap: 10px; }
.unlock-item::before { content: '✦'; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
.portal-num { font-size: 11px; letter-spacing: 6px; color: var(--gold); text-transform: uppercase; margin-bottom: 16px; font-family: Georgia, serif; }
.price { font-size: 32px; color: var(--gold); margin-bottom: 6px; }
.price-note { font-size: 10px; color: var(--text4); margin-bottom: 20px; letter-spacing: 1px; }
.unlock-btn {
  display: block; width: 100%; padding: 16px;
  background: linear-gradient(135deg, #553388, #7744aa);
  border: none; color: #fff; font-family: Georgia, serif;
  font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
  cursor: pointer; border-radius: 3px; transition: all 0.2s;
  text-decoration: none; text-align: center; box-sizing: border-box;
}
.unlock-btn:hover { background: linear-gradient(135deg, #6644aa, #9955cc); }

.retake-btn {
  width: 100%; padding: 12px; background: transparent;
  border: 1px solid var(--border); color: var(--text4);
  font-family: Georgia, serif; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s;
}
.retake-btn:hover { border-color: var(--border2); color: var(--text3); }
</style>

// ── СОСТОЯНИЕ ──────────────────────────────────────────────────────────────
let current = 0;
let answers = {};
let tbQueue = [];

// ── ПРОИСХОЖДЕНИЕ ─────────────────────────────────────────────────────────
// Ответы уходят на сервер как есть; он либо задаёт ещё один вопрос, либо возвращает Origin.
const _SCAN_URL = 'https://pewgupxikbswhaqxjrwk.supabase.co/functions/v1/origin-scan';
let resolvedType = null;
let scanBusy = false;
async function scanServer(payload){
  const r = await fetch(_SCAN_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  if(!r.ok) throw new Error('scan failed');
  return await r.json();
}

function calculateResult() {
  if (scanBusy) return;
  scanBusy = true;
  const qa = {}, tb = {};
  QUESTIONS.forEach(q => { qa[q.id] = answers[q.id]; });
  tbQueue.forEach(t => { if (answers[t.id] !== undefined) tb[t.id] = answers[t.id]; });
  scanServer({ quiz: 'ru', answers: qa, tb: tb }).then(function(r){
    scanBusy = false;
    if (r.ask) {
      tbQueue.push({ id: r.ask.id, type: "binary", text: r.ask.text, opts: r.ask.opts.map(x => ({ text: x })) });
      renderTB();
      return;
    }
    resolvedType = r.result;
    showResult();
  }).catch(function(){ scanBusy = false; alert('Портал мигнул. Проверьте соединение и попробуйте ещё раз.'); });
}

function getType() { return resolvedType; }

// ── ДВИЖОК КВИЗА ────────────────────────────────────────────────────────────
function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  updateProgress();
  const quizEl = document.getElementById('quiz');

  let html = `<div class="q-block">
    <div class="q-num">Вопрос ${current + 1} из ${QUESTIONS.length}</div>
    <div class="q-text">${q.text}</div>`;

  if (q.type === "force4") {
    html += `<div class="opts-force4">`;
    q.opts.forEach((opt, i) => {
      const sel = answers[q.id] === i ? 'selected' : '';
      html += `<button class="opt-btn ${sel}" onclick="selectForce4(${q.id}, ${i})">${opt.text}</button>`;
    });
    html += `</div>`;
  }
  else if (q.type === "most_least") {
    const saved = answers[q.id] || { most: null, least: null };
    const hasMost = saved.most !== null;
    const hasLeast = saved.least !== null;

    let stepText = '';
    if (!hasMost) stepText = 'Шаг 1 из 2. Выберите то, что БОЛЬШЕ ВСЕГО похоже на вас';
    else if (!hasLeast) stepText = 'Шаг 2 из 2. Выберите то, что МЕНЬШЕ ВСЕГО похоже на вас';
    else stepText = 'Оба выбраны — нажми любой, чтобы изменить';

    html += `<div class="ml-step">${stepText}</div>
    <div class="opts-ml2">`;
    q.opts.forEach((opt, i) => {
      const isMost = saved.most === i;
      const isLeast = saved.least === i;
      let cls = 'ml2-btn';
      if (isMost) cls += ' is-most';
      else if (isLeast) cls += ' is-least';
      html += `<button class="${cls}" onclick="selectML2(${q.id}, ${i})">${opt.text}</button>`;
    });
    html += `</div>`;
  }
  else if (q.type === "ranking") {
    const saved = answers[q.id];
    const order = saved || q.opts.map((_, i) => i);
    const isConfirmed = !!saved;
    html += `<div class="rank-instruction">Расставьте стрелками: самое похожее наверху</div>
    <div class="opts-rank" id="rankList">`;
    order.forEach((optIdx, pos) => {
      html += `<div class="rank-item" data-idx="${optIdx}" data-pos="${pos}">
        <div class="rank-num">${pos + 1}</div>
        <div class="rank-text">${q.opts[optIdx].text}</div>
        <div class="rank-arrows">
          <button class="rank-arrow" onclick="moveRank(${q.id}, ${pos}, -1)" ${pos === 0 ? 'disabled' : ''}>↑</button>
          <button class="rank-arrow" onclick="moveRank(${q.id}, ${pos}, 1)" ${pos === order.length - 1 ? 'disabled' : ''}>↓</button>
        </div>
      </div>`;
    });
    html += `</div>`;
    if (!isConfirmed) {
      html += `<div style="margin-top:12px">
        <button class="nav-next" style="width:100%" onclick="confirmRanking(${q.id})">Подтвердить этот порядок</button>
      </div>`;
    }
  }

  const isAnswered = isQuestionAnswered(q);
  const isLast = current === QUESTIONS.length - 1;
  const hideNavNext = q.type === "ranking" && !isAnswered;

  html += `<div class="nav-row">
    <button class="nav-back" onclick="goBack()" ${current === 0 ? 'disabled' : ''}>Назад</button>
    <button class="nav-next" onclick="goNext()" ${isAnswered && !hideNavNext ? '' : 'disabled'} ${hideNavNext ? 'style="display:none"' : ''} id="nextBtn">
      ${isLast ? 'Узнать моё происхождение' : 'Продолжить'}
    </button>
  </div></div>`;

  quizEl.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTB() {
  const tb = tbQueue[tbQueue.length - 1];
  const quizEl = document.getElementById('quiz');
  const tbLabel = 'Ещё один вопрос, и ваше происхождение раскроется';
  document.getElementById('progressText').textContent = 'Почти готово';

  let html = `<div class="q-block">
    <div class="q-num" style="color:var(--accent2)">${tbLabel}</div>
    <div class="q-text">${tb.text}</div>
    <div class="opts-binary">`;
  tb.opts.forEach((opt, i) => {
    const sel = answers[tb.id] === i ? 'selected' : '';
    html += `<button class="opt-btn ${sel}" onclick="selectTB('${tb.id}', ${i})">${opt.text}</button>`;
  });
  html += `</div>
    <div class="nav-row">
      <button class="nav-back" onclick="goBackFromTB()">Назад</button>
      <button class="nav-next" onclick="finishTB()" ${answers[tb.id] !== undefined ? '' : 'disabled'} id="nextBtn">
        Раскрыть моё происхождение
      </button>
    </div></div>`;

  quizEl.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function isQuestionAnswered(q) {
  if (q.type === "most_least") {
    const a = answers[q.id];
    return a && a.most !== null && a.least !== null && a.most !== a.least;
  }
  if (q.type === "ranking") return answers[q.id] !== undefined;
  return answers[q.id] !== undefined && answers[q.id] !== null;
}

function selectForce4(qId, idx) {
  answers[qId] = idx;
  renderQuestion();
}

function selectML2(qId, idx) {
  if (!answers[qId]) answers[qId] = { most: null, least: null };
  const a = answers[qId];
  if (a.most === idx) { a.most = null; a.least = null; renderQuestion(); return; }
  if (a.least === idx) { a.least = null; renderQuestion(); return; }
  if (a.most === null) { a.most = idx; renderQuestion(); return; }
  if (a.least === null && idx !== a.most) { a.least = idx; renderQuestion(); return; }
  if (idx !== a.most) { a.least = idx; renderQuestion(); }
}

function selectTB(tbId, idx) {
  answers[tbId] = idx;
  renderTB();
}

function finishTB() {
  calculateResult();
}

function goNext() {
  const q = QUESTIONS[current];
  if (!isQuestionAnswered(q)) return;
  if (current === QUESTIONS.length - 1) {
    calculateResult();
    return;
  }
  current++;
  renderQuestion();
}

function goBackFromTB() {
  const tb = tbQueue[tbQueue.length - 1];
  if (tb) delete answers[tb.id];
  tbQueue.pop();
  current = QUESTIONS.length - 1;
  document.getElementById('progressText').textContent = `${QUESTIONS.length} / ${QUESTIONS.length}`;
  document.getElementById('progressFill').style.width = '100%';
  renderQuestion();
}

function goBack() {
  if (current > 0) { current--; renderQuestion(); }
}

function updateProgress() {
  const pct = Math.round((current / QUESTIONS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${current + 1} / ${QUESTIONS.length}`;
}

function confirmRanking(qId) {
  const q = QUESTIONS.find(q => q.id === qId);
  if (!answers[qId]) answers[qId] = q.opts.map((_, i) => i);
  renderQuestion();
}

function moveRank(qId, pos, dir) {
  const q = QUESTIONS.find(q => q.id === qId);
  const order = answers[qId] ? [...answers[qId]] : q.opts.map((_, i) => i);
  const newPos = pos + dir;
  if (newPos < 0 || newPos >= order.length) return;
  [order[pos], order[newPos]] = [order[newPos], order[pos]];
  answers[qId] = order;
  renderQuestion();
}

// ── РЕЗУЛЬТАТ ──────────────────────────────────────────────────────────────
function showResult() {
  if (typeof fbq !== 'undefined') fbq('track', 'Lead');
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('result').style.display = 'block';

  const type = getType();

  // Format date in Russian
  const now = new Date();

        <div class="unlock-item">Полный космический портрет вашего происхождения души. Откуда вы пришли и что несёте сюда</div>

// ── КРИСТАЛЛ ────────────────────────────────────────────────────────────────
function drawCrystal(c){
  const canvas=document.getElementById('resCrystal');if(!canvas||!c)return;
  const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,90);
  bg.addColorStop(0,c.bg);bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  c.tris.forEach(([x0,y0,x1,y1,x2,y2,c0,c1,st])=>{
    ctx.save();ctx.globalCompositeOperation='screen';
    const grad=ctx.createLinearGradient(x0,y0,x2,y2);
    grad.addColorStop(0,c0);grad.addColorStop(1,c1);
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle=st;ctx.lineWidth=0.8;ctx.stroke();ctx.restore();
  });
  const e=c.edge;
  ctx.save();ctx.globalCompositeOperation='screen';
  ctx.beginPath();ctx.moveTo(e[0],e[1]);ctx.lineTo(e[2],e[3]);ctx.lineTo(e[4],e[5]);ctx.lineTo(e[6],e[7]);ctx.closePath();
  ctx.strokeStyle=e[8];ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
  ctx.save();ctx.globalCompositeOperation='screen';
  c.dots.forEach(([x,y,gr,glowCol,sz,fill])=>{
    const glow=ctx.createRadialGradient(x,y,0,x,y,gr);
    glow.addColorStop(0,glowCol);glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,gr,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
  });
  ctx.restore();
  const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,10);
  sg.addColorStop(0,'rgba(255,255,255,0.85)');sg.addColorStop(0.4,c.core);sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();ctx.restore();
}
</script>
