<style>
*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;min-height:100dvh;background:#0E2A4D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:24px 20px 40px}h1{font-size:30px;line-height:1.2;margin:24px 0 12px}h2{font-size:23px;line-height:1.3;margin:18px 0 8px}p{margin:0 0 16px;color:#CFE6F7}
.bar{height:6px;border-radius:6px;background:#23446d;overflow:hidden}.bar i{display:block;height:100%;background:#AFFC41;transition:width .25s}
.hint{color:#AFFC41;font-weight:600;margin:0 0 14px;min-height:26px}

.opt.on{border-color:#AFFC41;background:#1d4a5c}.opt.no{border-color:#9DD3F5}.tag{flex:none;background:#AFFC41;color:#24400A;border-radius:20px;padding:2px 12px;font-size:15px;font-weight:700}.no .tag{background:#9DD3F5;color:#0E2A4D}
.btn{display:block;width:100%;border:0;border-radius:12px;background:#AFFC41;color:#24400A;font-weight:700;padding:17px;margin-top:14px}.btn:disabled{opacity:.35;cursor:default}
.back{background:none;border:0;padding:14px 12px 14px 0;color:#9DD3F5;font-size:17px}input{width:100%;font:inherit;font-size:20px;border:2px solid #2c5280;border-radius:12px;background:#fff;color:#1A2433;padding:15px}

</style></head><body><main id="m"></main><script>
const U={en:{t:"Find your Origin",s:"28 questions, about 7 minutes. There are no right answers: choose what is true for you through your whole life, not only today.",n:"Your name",p:"Only Alexandra will see your answers.",go:"Start",one:"Choose one",most:"Choose the one that fits most",least:"Now the one that fits least",rank:"Tap in order, from most like you to least",next:"Next",back:"Back",M:"most",L:"least",done:"Thank you.",d2:"Your answers are with Alexandra.",err:"Could not send. Check the connection and tap again.",re:"Send again",of:" of "},
ru:{t:"Найдите свой Origin",s:"28 вопросов, примерно 7 минут. Правильных ответов нет: выбирайте то, что верно для вас всю жизнь, а не только сегодня.",n:"Ваше имя",p:"Ваши ответы увидит только Александра.",go:"Начать",one:"Выберите одно",most:"Выберите то, что подходит больше всего",least:"Теперь то, что подходит меньше всего",rank:"Нажимайте по порядку, от самого похожего к самому непохожему",next:"Дальше",back:"Назад",M:"больше",L:"меньше",done:"Спасибо.",d2:"Ваши ответы уже у Александры.",err:"Не отправилось. Проверьте связь и нажмите ещё раз.",re:"Отправить ещё раз",of:" из "}};
const G=new URLSearchParams(location.search).get('g')||'';const KEY='scan_game_v1_'+G,m=document.getElementById('m');let S=null,Q=null,t0=0;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,12);
if(!S)S={id:uid(),lang:(navigator.language||'').startsWith('ru')?'ru':'en',name:'',i:-1,a:{},tb:{},ask:[],ord:{},ms:{}};
const keep=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d};const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u=()=>U[S.lang];
const list=()=>Q[S.lang].concat(S.ask.map(x=>({id:x.id,type:'binary',text:x.text,opts:x.opts})));
const val=q=>q.type==='binary'?S.tb[q.id]:S.a[q.id];const put=(q,v)=>{(q.type==='binary'?S.tb:S.a)[q.id]=v;keep()};
function order(q){if(!S.ord[q.id]){const a=q.opts.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.ord[q.id]=a;keep()}return S.ord[q.id]}
function full(q){const v=val(q);if(v===undefined)return false;if(q.type==='most_least')return v.most!=null&&v.least!=null;if(q.type==='ranking')return v.length===4;return true}
function draw(){document.documentElement.lang=S.lang;m.innerHTML='';scrollTo(0,0);if(S.end)return end();if(S.i<0)return intro();const L=list();if(S.i>=L.length)return send();ques(L[S.i],L)}
function intro(){const d=el(`<div class="langs"><button type="button" data-l="en" class="${S.lang==='en'?'on':''}">English</button><button type="button" data-l="ru" class="${S.lang==='ru'?'on':''}">Русский</button></div><h1>${u().t}</h1><p>${u().s}</p><label for="nm">${u().n}</label><input id="nm" maxlength="60" autocomplete="given-name"><p style="margin-top:12px">${u().p}</p><button class="btn" id="go">${u().go}</button>`);m.append(d);
const n=d.querySelector('#nm'),g=d.querySelector('#go');n.value=S.name;g.disabled=!S.name.trim();n.oninput=()=>{S.name=n.value;g.disabled=!n.value.trim();keep()};d.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;keep();draw()});g.onclick=()=>{S.i=0;keep();draw()}}
function ques(q,L){t0=Date.now();const d=el(`<div class="bar"><i style="width:${Math.round(S.i/L.length*100)}%"></i></div><button class="back">← ${u().back}</button><span style="float:right;padding:14px 0;color:#9DD3F5">${S.i+1}${u().of}${L.length}</span><h2 tabindex="-1">${esc(q.text)}</h2><div class="hint" aria-live="polite"></div><div class="os"></div><button class="btn">${u().next}</button>`);m.append(d);
const os=d.querySelector('.os'),h=d.querySelector('.hint'),nx=d.querySelector('.btn');
function paint(){const v=val(q);os.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i,g=b.querySelector('.tag');b.className='opt';g.hidden=true;let on=false;
if(q.type==='most_least'&&v){if(v.most===i){on=true;g.textContent=u().M}else if(v.least===i){b.classList.add('no');g.textContent=u().L;g.hidden=false}}
else if(q.type==='ranking'&&v){const k=v.indexOf(i);if(k>=0){on=true;g.textContent=k+1}}else if(v===i&&typeof v==='number'){on=true;g.textContent='✓'}
if(on){b.classList.add('on');g.hidden=false}b.setAttribute('aria-pressed',on||b.classList.contains('no'))});
h.textContent=q.type==='most_least'?(v&&v.most!=null?u().least:u().most):q.type==='ranking'?u().rank:u().one;nx.disabled=!full(q)}
order(q).forEach(i=>{const b=document.createElement('button');b.type='button';b.className='opt';b.dataset.i=i;b.innerHTML=`<span>${esc(q.opts[i])}</span><span class="tag" hidden></span>`;b.onclick=()=>{let v=val(q);
if(q.type==='most_least'){v={...(v||{})};if(v.most===i)v={};else if(v.least===i)delete v.least;else if(v.most==null)v={most:i};else v.least=i;put(q,v)}
else if(q.type==='ranking'){v=[...(v||[])];const k=v.indexOf(i);if(k>=0)v=v.slice(0,k);else v.push(i);put(q,v)}else put(q,i);paint()};os.append(b)});
paint();d.querySelector('h2').focus({preventScroll:true});
d.querySelector('.back').onclick=()=>{S.i--;keep();draw()};nx.onclick=()=>{S.ms[q.id]=(S.ms[q.id]||0)+Date.now()-t0;S.i++;keep();draw()}}
async function send(){m.append(el('<h1>…</h1>'));try{const r=await fetch('https://pewgupxikbswhaqxjrwk.supabase.co/functions/v1/game-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'answers',g:G,id:S.id,name:S.name,lang:S.lang,answers:S.a,tb:S.tb,ms:S.ms})});if(!r.ok)throw 0;const j=await r.json();if(j.ask){S.ask.push(j.ask);keep();return draw()}S.end=true;keep();draw()}catch(e){m.innerHTML='';const d=el(`<h1>${u().err}</h1><button class="btn">${u().re}</button>`);d.querySelector('button').onclick=draw;m.append(d)}}
function end(){m.append(el(`<h1>${u().done}</h1><p>${u().d2}</p>`))}
Q={"en": [{"id": 1, "type": "force4", "text": "You arrive somewhere a conversation is already in motion. Before you consciously decide to pay attention, what has your body already registered?", "opts": ["The physical reality. What feels grounded, what resources are present, the tangible facts of the space.", "The underlying structure. Whether the situation holds together or if something feels fundamentally off-balance.", "The unspoken dynamic. Who needs what, the invisible threads connecting the people, what is being carefully avoided.", "The current of desire. Who is truly alive in this moment, and where the real energy is trying to move."]}, {"id": 9, "type": "most_least", "text": "Select the gift you most naturally bring into a space, and the one that feels least like you.", "opts": ["A presence that creates deep safety, making others feel profoundly seen.", "A spark of aliveness that activates the energy and makes things move.", "An anchoring stability that helps others feel physically and practically grounded.", "A clarifying perspective that cuts through confusion and illuminates the path."]}, {"id": 15, "type": "force4", "text": "There is a theme your soul cannot stop exploring. You return to it, notice when others miss it, and care about it deeply. Which domain pulls you the most?", "opts": ["The art of genuine connection. What it means to truly meet another soul without losing yourself.", "The truth of our desires. What it means to follow your authentic calling and live fully alive.", "The mastery of the physical world. How we handle our bodies, our resources, and build a grounded life.", "The pursuit of clarity. How we find truth, build sound frameworks, and see without illusion."]}, {"id": 21, "type": "most_least", "text": "We all have areas where we prefer to simply receive rather than lead. Select the domain where you most naturally let others take the reins, and the one where you least do this.", "opts": ["In navigating group dynamics. If someone else is reading the room, I can just exist in it.", "In finding the spark. If the environment already has a strong current, I can just flow with it.", "In handling the physical details. If someone else manages the logistics and resources, I can just receive them.", "In building the framework. If a coherent system is provided, I can just work within it."]}, {"id": 25, "type": "ranking", "text": "Rank these four ways of moving through an experience, from most like you (1) to least like you (4).", "opts": ["I want to dwell inside the moment. Completion feels like a loss; the beauty is in the unfolding.", "I move toward the resolution. The point is to arrive, and lingering in the middle feels uncomfortable.", "I need to feel the tangible result. After it ends, I want to see what was actually built and what remains.", "I need to understand what it meant. After it ends, I want to see the pattern it revealed."]}, {"id": 2, "type": "force4", "text": "A stranger is pouring their heart out to you. Minutes in, without trying to analyze them, you already know something essential. What is it?", "opts": ["Whether their story actually makes sense, or if there is a crack in their reasoning.", "What they truly need from you, hiding just beneath the words they are saying.", "Whether they actually want to change, or if they are secretly holding onto the pain.", "The practical, concrete step they are avoiding that would actually solve their problem."]}, {"id": 10, "type": "most_least", "text": "Select the mark you most often leave on a conversation, and the one you least often leave.", "opts": ["People leave feeling deeply understood, as if something real was finally witnessed.", "People leave feeling activated, carrying a new spark of energy they didn’t have before.", "People leave with a concrete shift, feeling a practical matter was finally handled.", "People leave with a new perspective, seeing their situation with sudden clarity."]}, {"id": 16, "type": "force4", "text": "You are watching someone handle a situation carelessly, and you feel an irresistible pull to step in. What are they mishandling?", "opts": ["Their impact on others. They are breaking the connection or ignoring the emotional reality.", "Their own truth. They are performing a life instead of honoring what they actually want.", "The practical reality. They are ignoring the physical facts or mismanaging resources.", "The logic of the situation. They are operating on a flawed assumption that will collapse."]}, {"id": 22, "type": "most_least", "text": "Select the pattern that most resonates with your experience, and the one that least resonates.", "opts": ["I sometimes absorb the emotional weight of a room before deciding if it’s good for me.", "I sometimes get swept up in another person’s energy before realizing it isn’t my own.", "I sometimes accept the physical arrangements provided without questioning if they serve me.", "I sometimes adopt a way of thinking without testing if the foundation is truly sound."]}, {"id": 26, "type": "force4", "text": "A significant chapter in your life has just closed. What is your very first instinct?", "opts": ["To linger in the feeling of it, letting the experience wash over me a little longer.", "To cleanly close the door. The energy is already moving toward what comes next.", "To look at what remains. To assess the tangible reality of what was built.", "To extract the lesson. To understand the hidden structure of why it happened."]}, {"id": 3, "type": "force4", "text": "The energy in a group suddenly derails. People are confused and directionless. Before you even decide to act, where does your focus automatically go?", "opts": ["To the immediate physical fix. What tangible action will ground the situation right now.", "To the unspoken tension. Who caused the shift and what the people actually need to feel safe again.", "To the root cause. Where the plan broke down and what the most logical next step is.", "To the lost spark. What everyone is secretly craving but not saying, and how to bring the life back."]}, {"id": 11, "type": "most_least", "text": "Select the reason people most often seek you out, and the reason they least often do.", "opts": ["When they need to feel less alone, seeking someone who will truly hear them.", "When they feel numb, seeking someone who can remind them how to feel alive.", "When they are overwhelmed, seeking someone who knows how to ground the situation.", "When they are confused, seeking someone who can untangle the complexity."]}, {"id": 17, "type": "force4", "text": "There is a central question your soul has been exploring in this lifetime. Which of these feels closest to that core inquiry?", "opts": ["How do we create genuine intimacy without losing our own center?", "How do we know when a desire is truly ours, and find the courage to follow it?", "How do we build a life that feels deeply rooted and secure in the physical world?", "How do we strip away illusions to see the pure, unvarnished truth?"]}, {"id": 23, "type": "most_least", "text": "Select the area where you most prefer to just receive the final outcome, and the area where you least prefer this.", "opts": ["Knowing where I stand with someone. I’d rather just be told than have to figure it out.", "Knowing my own direction. I sometimes wish my desires would just arrive fully formed.", "Managing the logistics of life. I’d love it if the practical details were just handled for me.", "Finding a framework to trust. I’d rather be given a solid philosophy to work within."]}, {"id": 27, "type": "force4", "text": "When you are trying to deeply understand something, how does that clarity usually arrive?", "opts": ["Through connection. I need to talk it out and feel it in the presence of someone else.", "Through movement. I think toward a resolution and feel restless until I reach the point.", "Through tangible action. I need to work with it physically and understand it by doing.", "Through deconstruction. I need to take it apart, find the pattern, and see how it fits."]}, {"id": 4, "type": "force4", "text": "You watch others struggle to learn a skill that has simply always been second nature to you. What is it?", "opts": ["Knowing exactly what you want. You don’t understand why others find it so hard to hear their own desires.", "Reading the emotional undercurrents of a room. You’ve never needed a guide to understand people.", "Seeing the architecture of an idea. You instantly know if a concept is built on a solid foundation.", "Navigating the material world. You’ve always felt a natural ease with the physical and practical aspects of life."]}, {"id": 12, "type": "most_least", "text": "Select the capacity that flows from you most effortlessly, and the one that flows least effortlessly.", "opts": ["The ability to create profound, authentic contact with another person.", "The ability to bring a palpable, magnetic energy into any space.", "The ability to manifest ideas into solid, tangible reality.", "The ability to distill chaos into elegant, structural clarity."]}, {"id": 18, "type": "force4", "text": "You have a high standard in one specific area, and you find it difficult to tolerate when others are careless with it. Which area is this?", "opts": ["How people treat one another. You have a deep reverence for the sacredness of connection.", "Authenticity of spirit. You can instantly feel when someone is performing rather than living truly.", "Respect for the material. You see the cost of ignoring physical reality, resources, or the body.", "Intellectual integrity. You feel a flawed argument or a false assumption like a wrong note in a song."]}, {"id": 24, "type": "most_least", "text": "Select the domain where you have historically been most likely to accept what wasn’t quite right for you, and the domain where you are least likely to do this.", "opts": ["In relationships. I have sometimes stayed too long or trusted too readily.", "In following a path. I have sometimes been swept into a current that wasn’t truly mine.", "In material situations. I have sometimes accepted practical arrangements without asking if they served me.", "In adopting beliefs. I have sometimes built my life on a foundation someone else created."]}, {"id": 28, "type": "ranking", "text": "Rank these four deep yearnings from what pulls your soul the most (1) to what pulls it the least (4).", "opts": ["To experience profound, unmasked intimacy and love.", "To live with unapologetic passion, following my truest spark.", "To build something enduring and real in the physical world.", "To see the universe clearly, without illusion or distortion."]}, {"id": 5, "type": "force4", "text": "A group decision is dragging on endlessly. What is the glaring issue that is obvious to you, but everyone else is ignoring?", "opts": ["The practical constraints. They are ignoring the actual, physical limitations of the situation.", "The hidden desires. No one is admitting what they actually want, so nothing can move forward.", "The unspoken tension. The real issue is who trusts whom, not the decision itself.", "The flawed premise. They are arguing over the wrong question entirely."]}, {"id": 13, "type": "most_least", "text": "Select the experience where you feel most fully yourself, and the one where you feel least fully yourself.", "opts": ["When a conversation deepens unexpectedly and a profound truth is shared between us.", "When I am moving toward something I deeply desire, and all distractions fall away.", "When I can feel the weight of something I have built and know it will last.", "When a complex concept suddenly clicks into place and I understand the hidden pattern."]}, {"id": 19, "type": "force4", "text": "We all have an edge where we push ourselves to perform a mastery we are still developing. Where do you feel the strain of this overreach?", "opts": ["In the emotional field. I try to hold space for more than is mine to carry.", "In my sense of direction. I project a certainty about what I want, even when I am still searching.", "In the material world. I try to project a competence with physical reality that I am still learning to embody.", "In my convictions. I defend viewpoints with more certainty than I actually feel inside."]}, {"id": 6, "type": "force4", "text": "You meet a stranger and instantly recognize them as part of your cosmic family. What gave them away?", "opts": ["The effortless, grounded way they navigated the physical details of the moment.", "The sharp, structural elegance of how they observed the world.", "The unspoken way they immediately felt and responded to the energy between you.", "The undeniable, authentic spark of life running beneath everything they did."]}, {"id": 14, "type": "most_least", "text": "Select the gift your soul has been offering the world since before you had words for it, and the one that feels least natural.", "opts": ["The gift of true meeting. Creating a space where people feel safe enough to drop their masks.", "The gift of awakening. Carrying a frequency that invites others to remember their own passion.", "The gift of grounding. Knowing how to anchor ideas into the tangible, physical world.", "The gift of vision. Seeing the truth clearly and having the courage to name it."]}, {"id": 20, "type": "force4", "text": "There is a specific territory where life has handed you your deepest lessons and most complex challenges. Which domain has been your greatest teacher?", "opts": ["The physical world. Navigating the reality of the body, resources, and earthly stability.", "The relational field. Navigating the beautiful, messy reality of human connection and love.", "The domain of truth. Navigating belief systems, illusions, and learning how to see clearly.", "The domain of desire. Navigating what it means to claim my own path and follow my spark."]}, {"id": 7, "type": "force4", "text": "There is something you do so naturally that you barely notice it, while others spend years trying to cultivate it. What is it?", "opts": ["Sensing the invisible currents between people and knowing exactly what is needed.", "Trusting my own internal compass and knowing which way to move before thinking begins.", "Existing comfortably in my body and moving through the practical world with ease.", "Instantly sensing whether an idea or system is fundamentally sound or flawed."]}, {"id": 8, "type": "force4", "text": "In moments when a deep, sudden knowing lands in your body, faster than thought, what are you usually recognizing?", "opts": ["The structural truth. A sudden, felt sense of whether something holds together or falls apart.", "The relational truth. A sudden awareness of who is being genuine and who is wearing a mask.", "The material truth. A sudden understanding of what is solid and what is fragile in the physical space.", "The energetic truth. A sudden recognition of where the real momentum wants to flow."]}], "ru": [{"id": 1, "type": "force4", "text": "Вы пришли в компанию, где уже идёт важный разговор. Что вы замечаете первым?", "opts": ["Что здесь есть по делу: деньги, ресурсы, кто что реально может.", "Логику спора: где аргументы держатся, а где дыра.", "Людей: кто на кого обижен, кто кому нравится, о чём молчат.", "Энергию: кто здесь горит, кто уже сдулся. И чего хотите вы сами."]}, {"id": 2, "type": "force4", "text": "Новый знакомый рассказывает о чём-то важном для себя. Что вы понимаете о нём уже через пару минут?", "opts": ["Где в его рассказе не сходится логика. Он эту трещину ещё не видит, а вы уже видите.", "Что ему на самом деле нужно от разговора, кроме того, о чём он просит.", "Хочет ли он правда что-то менять или в глубине держится за то, что есть.", "Какое одно конкретное дело он откладывает. Именно оно изменило бы всё."]}, {"id": 3, "type": "force4", "text": "В группе всё пошло не так: люди потеряли направление, никто не знает, что делать. Вас ни о чём не просили. Что вы видите первым?", "opts": ["Что конкретно сломалось, чего не хватает и какое действие это починит.", "Кто источник напряжения и что сейчас нужно каждому.", "В каком месте план дал сбой и как из этого выйти.", "Где пропал огонь и какая цель снова зажжёт людей."]}, {"id": 4, "type": "force4", "text": "Что вам всегда давалось само, хотя другие этому долго учатся? Про что вы думаете: «А разве этому надо учиться?»", "opts": ["Понимать, чего я хочу. Люди ищут это годами, а мне это всегда было ясно.", "Чувствовать людей. Что человек имеет в виду на самом деле, я слышу сразу.", "Видеть, как всё устроено. Выдержит ли план, сходится ли аргумент.", "Справляться с деньгами, телом, бытом. Спокойно, без лишней тревоги."]}, {"id": 5, "type": "force4", "text": "Группа никак не может принять решение. Вы уже видите, что все обходят стороной. Что это обычно?", "opts": ["Реальные факты: сколько денег, времени и сил есть на самом деле.", "Чего люди на самом деле хотят. Пока это не назовут вслух, ничего не сдвинется.", "Кто кому доверяет и где настоящее напряжение между людьми.", "Ошибку в рассуждении, из-за которой разговор ходит по кругу."]}, {"id": 6, "type": "force4", "text": "Незнакомый человек вдруг кажется вам «своим». Что вас в нём зацепило?", "opts": ["Как легко он справляется с делами, будто это ничего не стоит.", "Как точно он думает и говорит.", "Как он сразу почувствовал, что происходит между людьми.", "Какой он живой, сколько в нём желания."]}, {"id": 7, "type": "force4", "text": "Что вы умеете с детства так естественно, что даже не считаете это умением?", "opts": ["Чувствовать, что происходит между людьми. Даже когда все молчат.", "Знать, куда мне хочется. Желание приходит раньше любых раздумий.", "Уверенно жить в материальном мире: тело, деньги, практические дела.", "Сразу видеть, где в идее или плане слабое место."]}, {"id": 8, "type": "force4", "text": "Иногда тело понимает раньше головы. Что вы обычно чувствуете «нутром» первым?", "opts": ["Что-то не сходится. Внутри щёлкает, хотя я ещё не знаю, что именно.", "Кто здесь настоящий, а кто играет роль.", "Что в ситуации надёжно, а что вот-вот развалится.", "Куда всё это хочет двигаться и есть ли здесь живая энергия."]}, {"id": 9, "type": "most_least", "text": "Что вы приносите с собой, куда бы ни пришли? Выберите самое похожее на вас и самое непохожее.", "opts": ["Тепло. Рядом со мной люди чувствуют, что их правда видят.", "Энергию. Рядом со мной всё начинает двигаться.", "Опору. Рядом со мной людям спокойно и надёжно.", "Ясность. Рядом со мной запутанное становится понятным."]}, {"id": 10, "type": "most_least", "text": "С чем люди уходят после разговора с вами? Выберите самое частое и самое редкое.", "opts": ["С чувством, что их поняли глубже, чем они ожидали.", "Более живыми и заряженными, чем пришли.", "С конкретным решением практического вопроса.", "С новым взглядом на свою ситуацию."]}, {"id": 11, "type": "most_least", "text": "Зачем вам обычно звонят? Выберите самое подходящее и самое непохожее.", "opts": ["Когда одиноко и нужно, чтобы кто-то по-настоящему выслушал.", "Когда пропал запал и хочется снова почувствовать вкус к жизни.", "Когда нужно что-то реально сделать и разрулить.", "Когда нужно разобраться в сложном и понять, что к чему."]}, {"id": 12, "type": "most_least", "text": "Какая сила ваша? Выберите самую близкую и самую далёкую.", "opts": ["Создавать настоящий контакт с человеком.", "Заражать своим желанием, так что другие тоже загораются.", "Воплощать: превращать идею в реальную вещь.", "Находить порядок в хаосе и объяснять его другим."]}, {"id": 13, "type": "most_least", "text": "Когда вы больше всего чувствуете себя собой? Выберите самое близкое и самое далёкое.", "opts": ["Когда разговор ушёл туда, куда никто не планировал, и прозвучало что-то настоящее.", "Когда точно знаю, чего хочу, иду к этому, и всё остальное отступает.", "Когда вижу результат своего труда и знаю, что он надёжен.", "Когда наконец понимаю то, что раньше было неясно, и всё встаёт на место."]}, {"id": 14, "type": "most_least", "text": "Какой дар был в вас с самого начала, а какой кажется самым чужим?", "opts": ["Дар близости: создавать настоящие встречи между людьми.", "Дар живости: напоминать другим, чего они хотят на самом деле.", "Дар земли: уверенно жить в теле и в реальном мире.", "Дар ясности: видеть, что работает, а что нет, и говорить об этом."]}, {"id": 15, "type": "force4", "text": "К какой теме вас тянет снова и снова? Вы видите чужие ошибки и знаете, как лучше.", "opts": ["Отношения. Что на самом деле нужно любви и какой бывает настоящая близость.", "Желания. Как жить свою жизнь и хотеть по-настоящему своего.", "Деньги, здоровье, тело. Как твёрдо стоять на ногах в реальном мире.", "Истина. Где логика, а где ошибка. Слабый аргумент цепляет меня сразу."]}, {"id": 16, "type": "force4", "text": "Кто-то небрежно обращается с тем, что вам важно. Где вам сильнее всего хочется вмешаться?", "opts": ["Когда человек плохо обращается с другими людьми.", "Когда человек живёт чужую жизнь и предаёт свои желания.", "Когда человек беспечен с деньгами, телом, делами. Я уже вижу, чем это кончится.", "Когда человек делает неверный вывод или строит шаткую систему."]}, {"id": 17, "type": "force4", "text": "Какой вопрос возвращается в вашу жизнь снова и снова, в самых разных обстоятельствах?", "opts": ["Как любить и быть рядом, оставаясь собой?", "Как понять, что это моё желание, а не навязанное?", "Как построить что-то надёжное и что на самом деле нужно моему телу?", "Как видеть правду, а не то, что хочется видеть?"]}, {"id": 18, "type": "force4", "text": "Где вас больше всего задевает небрежность? Вы видите, как надо, даже если вас не спрашивали.", "opts": ["В отношениях. Как люди обращаются друг с другом и что называют любовью.", "В жизни «по шаблону». Когда люди делают, что должны, вместо того, чего хотят.", "В практической жизни. Как люди тратят деньги, относятся к телу, избегают реальных дел.", "В мышлении. Когда выводы не следуют из фактов. Это режет слух, как фальшивая нота."]}, {"id": 19, "type": "force4", "text": "Где вы стараетесь казаться сильнее и увереннее, чем есть сейчас на самом деле?", "opts": ["В отношениях. Тащу на себе чужие чувства и отвечаю за то, чем не могу управлять.", "В желаниях. Показываю, что точно знаю, чего хочу, а внутри иногда сомневаюсь.", "В деньгах и делах. Со стороны всё под контролем, а на деле я ещё учусь.", "В идеях. Спорю увереннее, чем чувствую себя внутри."]}, {"id": 20, "type": "force4", "text": "Где вы получили самые важные уроки и больше всего трудного опыта?", "opts": ["В материальном: деньги, тело, стабильность.", "В отношениях: любовь, близость, связь с людьми.", "В мышлении: поиск правды, понимание, как всё устроено.", "В желаниях: понять, чего хочу, и решиться это прожить."]}, {"id": 21, "type": "most_least", "text": "Где вам легко довериться и идти за другим, а где это даётся труднее всего?", "opts": ["В общении. Пусть кто-то другой чувствует атмосферу и налаживает связи, я пойду следом.", "В направлении. Пусть кто-то задаёт ритм и цель, я с удовольствием подхвачу.", "В быту и деньгах. Пусть кто-то другой занимается практикой, я с радостью приму.", "В идеях. Пусть кто-то даст понятную систему, я спокойно буду работать по ней."]}, {"id": 22, "type": "most_least", "text": "Какой сценарий вам знаком больше всего, а какой меньше всего?", "opts": ["Я впитываю настроение людей вокруг, ещё не решив, хорошо ли мне в нём.", "Меня уносит чужой поток, и я замечаю это уже потом.", "Я соглашаюсь на то, что предлагают: еда, комфорт, условия. Без проверки, подходит ли мне.", "Я принимаю чужую систему, если она ясно изложена, и проверяю её основу уже потом."]}, {"id": 23, "type": "most_least", "text": "Где вам хочется просто получить готовый ответ, а где он нужен меньше всего?", "opts": ["В отношениях. Просто скажи мне, всё ли у нас хорошо.", "В желаниях. Хочу, чтобы ясное желание пришло само, без поисков.", "В практических делах. Пусть деньги и логистика просто будут решены.", "В мышлении. Дай мне хорошую систему, я буду работать по ней."]}, {"id": 24, "type": "most_least", "text": "Где вы когда-то согласились на то, что вам не подходило? Выберите самое похожее и самое непохожее.", "opts": ["В отношениях. Задерживаюсь слишком долго, доверяю слишком быстро.", "В чужой цели. Иду за чужим направлением и понимаю это, когда уже далеко.", "В материальном. Беру то, что дают, не спрашивая себя, хорошо ли мне это.", "В чужих идеях. Строю на чужой основе, а потом она не выдерживает."]}, {"id": 25, "type": "ranking", "text": "Как вы проживаете жизнь? Расставьте от самого похожего (1) до самого непохожего (4).", "opts": ["Мне важен сам процесс. Когда что-то заканчивается, мне почти жаль.", "Мне важен результат. Дело сделано, и сразу дальше, зависать посередине тяжело.", "Мне важно увидеть, что построено. Убедиться, что результат реальный и надёжный.", "Мне важно понять, что произошло. Чему это научило и что стало ясно."]}, {"id": 26, "type": "force4", "text": "Только что закончилось что-то важное: разговор, этап или отношения. Чего вам хочется первым?", "opts": ["Побыть с этим. Прочувствовать, что это значило.", "Закрыть и идти дальше. Уже начинается новое.", "Посмотреть, что осталось по факту: что построено, а что нет.", "Понять, что это открыло и чему меня научило."]}, {"id": 27, "type": "force4", "text": "Вам нужно в чём-то разобраться. С чего вы начинаете?", "opts": ["Обсуждаю с кем-то. Понимание приходит в разговоре.", "Сразу иду к выводу. Мне нужен ясный итог, долго разбираться утомительно.", "Пробую руками. Понимаю, когда делаю и вижу результат.", "Ищу принцип. Понимаю, когда вижу закономерность."]}, {"id": 28, "type": "ranking", "text": "Что притягивает вас в жизни сильнее всего? Расставьте от самого сильного (1) до самого слабого (4).", "opts": ["Любовь и близость. Настоящий контакт с людьми.", "Хотеть своего без извинений и идти за своей душой.", "Построить что-то реальное, что останется после меня.", "Понимать. Видеть ясно, без иллюзий."]}]};draw();
