<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0A0A0A;
  --bg2: #111111;
  --gold: #C9A96E;
  --gold2: #E8D5A8;
  --text: #E8E4DF;
  --text2: #C9C1B8;
  --muted: #5F5A55;
  --border: rgba(201,169,110,0.08);
  --border2: rgba(201,169,110,0.18);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  font-weight: 300;
  min-height: 100vh;
  padding: 48px 20px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-font-smoothing: antialiased;
}

.eyebrow {
  font-size: 10px; letter-spacing: 5px; color: var(--muted);
  text-transform: uppercase; text-align: center; margin-bottom: 16px;
}

h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 38px; color: var(--text); letter-spacing: 4px;
  text-align: center; font-weight: 300; margin-bottom: 6px;
}

.subtitle {
  font-size: 10px; letter-spacing: 4px; color: var(--muted);
  text-transform: uppercase; text-align: center; margin-bottom: 40px;
}

/* ── SELECTORS ── */
.selectors {
  display: flex; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; justify-content: center;
}
.selector-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.selector-label {
  font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase;
}
select {
  background: var(--bg2); border: 1px solid var(--border2); color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif; font-weight: 300;
  font-size: 12px; padding: 10px 16px; cursor: pointer; outline: none;
  min-width: 200px; appearance: none; text-align: center; letter-spacing: 1px;
}
select:focus { border-color: var(--gold); }

.vs {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 24px; color: var(--muted); align-self: flex-end; padding-bottom: 10px;
}

.calc-btn {
  padding: 14px 48px; border: 1px solid var(--border2); background: transparent;
  color: var(--gold); font-family: 'Inter', -apple-system, sans-serif;
  font-weight: 300; font-size: 11px; letter-spacing: 4px;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
  margin-bottom: 40px;
}
.calc-btn:hover { background: rgba(201,169,110,0.06); border-color: var(--gold); }

/* ── RESULT AREA ── */
#result { width: 100%; max-width: 860px; display: none; flex-direction: column; align-items: center; }

/* Bond banner */
.bond-banner {
  width: 100%; text-align: center; padding: 28px 20px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}
.bond-symbol { font-size: 30px; margin-bottom: 10px; }
.bond-name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 28px; letter-spacing: 4px; margin-bottom: 8px; font-weight: 300;
}
.bond-tension {
  font-size: 10px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase;
}

/* ── MERGED CRYSTAL ── */
.merged-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; margin-bottom: 32px; width: 100%;
}
.merged-labels {
  display: flex; justify-content: space-between; width: 100%; max-width: 420px;
  padding: 0 8px;
}
.merged-label { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.crystal-name {
  font-size: 10px; letter-spacing: 3px; color: var(--text2); text-transform: uppercase;
}
.crystal-tagline {
  font-size: 9px; color: var(--muted); text-align: center; max-width: 140px; line-height: 1.5;
}

/* ── FUNCTION GRID ── */
.func-grid {
  width: 100%; display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-bottom: 32px;
}
@media (min-width: 600px) {
  .func-grid { grid-template-columns: repeat(4, 1fr); }
}
.func-cell {
  background: var(--bg2); border: 1px solid var(--border); padding: 16px 12px;
  text-align: center;
}
.func-cell .func-sym { font-size: 16px; margin-bottom: 6px; }
.func-cell .func-name {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 6px; color: var(--text2);
}
.func-cell .pair-quality {
  font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 6px; font-weight: 300;
}
.func-cell .pair-desc { font-size: 9px; color: var(--muted); line-height: 1.6; }

/* quality tones */
.q-ideal    { color: #88ccaa !important; border-color: rgba(136,204,170,0.15) !important; }
.q-harmonic { color: #88b8cc !important; border-color: rgba(136,184,204,0.15) !important; }
.q-tandem   { color: var(--gold2) !important; border-color: var(--border2) !important; }
.q-mirror   { color: var(--text2) !important; border-color: var(--border) !important; }
.q-mismatch { color: var(--gold) !important; border-color: var(--border2) !important; }
.q-trap     { color: #cc9966 !important; border-color: rgba(204,153,102,0.15) !important; }
.q-conflict { color: #cc7766 !important; border-color: rgba(204,119,102,0.15) !important; }

/* ── BOND DESCRIPTION ── */
.bond-desc {
  width: 100%; background: var(--bg2); border: 1px solid var(--border);
  padding: 32px 28px; margin-bottom: 32px;
}
.bond-desc h3 {
  font-size: 10px; letter-spacing: 4px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 20px;
}
.bond-desc p {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 18px; color: var(--text); line-height: 1.9;
  margin-bottom: 16px; font-weight: 300;
}
.bond-desc p.blurred {
  filter: blur(5px); user-select: none; -webkit-user-select: none;
  pointer-events: none; color: var(--text2);
}
.bond-unlock {
  display: block; margin-top: 20px; padding: 14px 24px; text-align: center;
  background: var(--gold); color: #0A0A0A;
  font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 11px;
  letter-spacing: 4px; text-transform: uppercase; text-decoration: none;
  transition: opacity 0.2s;
}
.bond-unlock:hover { opacity: 0.85; }

/* ── TENSION BAR ── */
.tension-wrap { width: 100%; margin-bottom: 32px; }
.tension-label {
  font-size: 10px; letter-spacing: 4px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 10px; text-align: center;
}
.tension-bar-bg {
  width: 100%; height: 2px; background: var(--bg2);
  overflow: hidden; border-top: 1px solid var(--border);
}
.tension-bar-fill { height: 100%; transition: width 0.8s ease; }
.tension-pct {
  font-size: 10px; color: var(--muted); text-align: center;
  margin-top: 8px; letter-spacing: 2px;
}

/* ── FOOTER ── */
.result-footer {
  font-size: 9px; color: var(--muted); letter-spacing: 4px;
  text-transform: uppercase; margin-top: 8px;
}

/* ── NAV BUTTONS ── */
.nav-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 520px; margin-top: 32px; }
.btn-gold {
  flex: 1; min-width: 180px; padding: 16px 20px; text-align: center;
  background: transparent; border: 1px solid var(--border2); color: var(--gold);
  font-family: 'Inter', -apple-system, sans-serif; font-weight: 300;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  text-decoration: none; transition: all 0.2s;
}
.btn-gold:hover { background: rgba(201,169,110,0.06); }

@media(max-width: 520px) {
  h1 { font-size: 30px; }
  .bond-desc p { font-size: 16px; }
  select { min-width: 160px; }
}

<div class="eyebrow">StarSeedSoul · Origin System</div>

  </div>

  <div class="result-footer">StarSeedSoul · Soul Bond Matrix</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const TYPES = [
  { name:"Siriusian" },
  { name:"Pleiadian" },
  { name:"Lemurian" },
  { name:"Cassiopeian" },
  { name:"Procyonian" },
  { name:"Lyran" },
  { name:"Arcturian" },
  { name:"Orion" },
  { name:"Vegan" },
  { name:"Zeta Reticulan" },
  { name:"Epsilon Eridan" },
  { name:"Atlantean" },
  { name:"Andromedan" },
  { name:"Polarisian" },
  { name:"Nibiruan" },
  { name:"Egyptian" },
  { name:"Titanian" },
  { name:"Blue Avian" },
  { name:"Tau Cetian" },
  { name:"Aldebaran" },
  { name:"Centaurian" },
  { name:"Herculean" },
  { name:"Anunnaki" },
  { name:"Hyperborean" },
];

const AXIS_COLORS = {
  up:{ r:255,g:200,b:20,  hex:"#ffc814" },
  down:{ r:210,g:40, b:40,  hex:"#d22828" },
  right:{ r:40, g:180,b:80,  hex:"#28b450" },
  left:{ r:60, g:120,b:255, hex:"#3c78ff" },
};

const AXIS_ANGLE = { up:-Math.PI/2, down:Math.PI/2, right:0, left:Math.PI };
const CH_RADIUS = [0,80,56,34,17];
const CH_WEIGHT = [0,0.60,0.25,0.12,0.03];

// ── PAIR READING ─────────────────────────────────────────────────────────────
// The reading of a pair and both crystal shapes come from the server; the page only shows them.
const VIEW_URL = 'https://pewgupxikbswhaqxjrwk.supabase.co/functions/v1/origin-view';
async function loadBond(a, b) {
  const r = await fetch(VIEW_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ bond:[a, b], set:'ss' }) });
  if (!r.ok) throw new Error('bond failed');
  return r.json();
}

function blendColors(axes) {
  let r=0,g=0,b=0;
  axes.forEach((f,i) => {
    const w = CH_WEIGHT[i+1];
    const c = AXIS_COLORS[f];
    r += c.r*w; g += c.g*w; b += c.b*w;
  });
  return { r:Math.round(r), g:Math.round(g), b:Math.round(b) };
}

// ── DRAW MERGED CRYSTALS ──────────────────────────────────────────────────────

function drawMergedCrystals(t1, t2, bondName) {
  const canvas = document.getElementById('mergedCrystal');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0,0,W,H);

  const blend1 = blendColors(t1.axes);
  const blend2 = blendColors(t2.axes);
  const blendC = {
    r: Math.round((blend1.r + blend2.r) / 2),
    g: Math.round((blend1.g + blend2.g) / 2),
    b: Math.round((blend1.b + blend2.b) / 2),
  };

  // Background glow
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 100);
  bg.addColorStop(0, `rgba(${blendC.r},${blendC.g},${blendC.b},0.12)`);
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // Draw both crystals at SAME center, one rotated +22.5°, other -22.5°
  const ROT = 22.5 * Math.PI / 180;

  drawCrystalOnContextRotated(ctx, t1, cx, cy, 1.0, 0.82, +ROT);
  drawCrystalOnContextRotated(ctx, t2, cx, cy, 1.0, 0.82, -ROT);

  // Center star
  const starGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 14);
  starGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
  starGrad.addColorStop(0.3, `rgba(${blendC.r+80},${blendC.g+80},${blendC.b+80},0.3)`);
  starGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = starGrad;
  ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawCrystalOnContextRotated(ctx, type, cx, cy, scale, globalAlpha, rotation) {
  const channels = {};
  type.axes.forEach((f,i) => channels[f] = i+1);
  const blend = blendColors(type.axes);

  const R = [0, 80, 56, 34, 17].map(r => r * scale);

  // Apply rotation to axes
  const tips = {};
  for (const [f,ch] of Object.entries(channels)) {
    const baseAngle = AXIS_ANGLE[f];
    const angle = baseAngle + rotation;
    tips[f] = { x: cx + Math.cos(angle)*R[ch], y: cy + Math.sin(angle)*R[ch] };
  }

  const tUp=tips.up, tDown=tips.down, tRight=tips.right, tLeft=tips.left;

  ctx.save();
  ctx.globalAlpha = globalAlpha;
  ctx.globalCompositeOperation = 'screen';

  const faces = [
    {pts:[cx,cy,tUp.x,tUp.y,tRight.x,tRight.y], f1:'up',f2:'right', b:0.85},
    {pts:[cx,cy,tUp.x,tUp.y,tLeft.x,tLeft.y], f1:'up',f2:'left', b:0.65},
    {pts:[cx,cy,tDown.x,tDown.y,tRight.x,tRight.y], f1:'down',f2:'right', b:0.55},
    {pts:[cx,cy,tDown.x,tDown.y,tLeft.x,tLeft.y], f1:'down',f2:'left', b:0.40},
  ];

  faces.forEach(face => {
    const c1=AXIS_COLORS[face.f1], c2=AXIS_COLORS[face.f2];
    const bf={ r:Math.round((c1.r+c2.r)/2), g:Math.round((c1.g+c2.g)/2), b:Math.round((c1.b+c2.b)/2) };
    const alpha = 0.14 + face.b * 0.18;
    const pts = face.pts;

    const grad = ctx.createLinearGradient(pts[0],pts[1],pts[4],pts[5]);
    grad.addColorStop(0, `rgba(${bf.r},${bf.g},${bf.b},${alpha+0.1})`);
    grad.addColorStop(1, `rgba(${Math.round(blend.r*.5)},${Math.round(blend.g*.5)},${Math.round(blend.b*.5)},${alpha*.4})`);

    ctx.beginPath();
    ctx.moveTo(pts[0],pts[1]); ctx.lineTo(pts[2],pts[3]); ctx.lineTo(pts[4],pts[5]);
    ctx.closePath(); ctx.fillStyle=grad; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[0],pts[1]); ctx.lineTo(pts[2],pts[3]); ctx.lineTo(pts[4],pts[5]);
    ctx.closePath();
    ctx.strokeStyle=`rgba(${bf.r+80},${bf.g+80},${bf.b+80},0.5)`;
    ctx.lineWidth=1.0; ctx.stroke();
  });

  // Outer silhouette
  ctx.beginPath();
  ctx.moveTo(tUp.x,tUp.y); ctx.lineTo(tRight.x,tRight.y); ctx.lineTo(tDown.x,tDown.y); ctx.lineTo(tLeft.x,tLeft.y);
  ctx.closePath();
  ctx.strokeStyle=`rgba(${blend.r+100},${blend.g+100},${blend.b+100},0.65)`;
  ctx.lineWidth=1.5; ctx.stroke();

  ctx.restore();
  ctx.save();
  ctx.globalAlpha = globalAlpha;
  ctx.globalCompositeOperation = 'screen';

  // Core glow
  const coreGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,24*scale);
  coreGrad.addColorStop(0, `rgba(${blend.r},${blend.g},${blend.b},0.45)`);
  coreGrad.addColorStop(0.5, `rgba(${blend.r},${blend.g},${blend.b},0.12)`);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle=coreGrad;
  ctx.beginPath(); ctx.arc(cx, cy, 80*scale, 0, Math.PI*2); ctx.fill();

  // Tip glows
  for (const [f,ch] of Object.entries(channels)) {
    const tip=tips[f], fc=AXIS_COLORS[f];
    const size=[0,7,5,3.5,2][ch]*scale;
    const glowR=[0,20,13,8,5][ch]*scale;
    const a=[0,0.5,0.35,0.22,0.12][ch];
    const glow=ctx.createRadialGradient(tip.x,tip.y,0,tip.x,tip.y,glowR);
    glow.addColorStop(0,`rgba(${fc.r},${fc.g},${fc.b},${a})`);
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(tip.x,tip.y,glowR,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(tip.x,tip.y,size,0,Math.PI*2);
    ctx.fillStyle=`rgba(${fc.r},${fc.g},${fc.b},0.9)`; ctx.fill();
  }

  ctx.restore();
}

// ── CALCULATE ─────────────────────────────────────────────────────────────────
let calcSeq = 0;
async function calculate() {
  const i1 = parseInt(document.getElementById('type1').value);
  const i2 = parseInt(document.getElementById('type2').value);
  const t1 = TYPES[i1], t2 = TYPES[i2];
  const seq = ++calcSeq;
  const v = await loadBond(t1.name, t2.name).catch(() => null);
  if (!v || seq !== calcSeq) return;

  // Bond banner
  document.getElementById('bondSymbol').textContent = v.sym;
  document.getElementById('bondName').textContent = v.verdict;
  document.getElementById('bondName').style.color = v.color;
  document.getElementById('bondTension').textContent = `Tension: ${v.tension}%`;

  // Tension bar
  const fill = document.getElementById('tensionFill');
  const pct = v.tension;
  const barColor = pct <= 25 ? '#88ccaa' : pct <= 50 ? '#C9A96E' : pct <= 75 ? '#cc9966' : '#cc7766';
  fill.style.width = pct + '%';
  fill.style.background = `linear-gradient(90deg, ${barColor}88, ${barColor})`;
  document.getElementById('tensionPct').textContent = `${pct}% tension`;

  // Merged crystal
  drawMergedCrystals({ axes: v.axes[0] }, { axes: v.axes[1] }, v.verdict);
  document.getElementById('cname1').textContent = t1.name;
  document.getElementById('cname2').textContent = t2.name;
  document.getElementById('ctagline1').textContent = 'Soul Origin';
  document.getElementById('ctagline2').textContent = 'Soul Origin';

  // Element grid
  const grid = document.getElementById('funcGrid');
  grid.innerHTML = '';
  for (const c of v.cells) {
    const cell = document.createElement('div');
    cell.className = `func-cell ${c.css}`;
    cell.innerHTML = `
      <div class="func-sym">${c.sym}</div>
      <div class="func-name">${c.element}</div>
      <div class="pair-quality ${c.css}">${c.label}</div>
      <div class="pair-desc">${c.desc}</div>
    `;
    grid.appendChild(cell);
  }

  // Bond description
  document.getElementById('bondWhy').textContent = v.why;
  document.getElementById('bondHow').textContent = v.how;

  // Show result
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'flex';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── POPULATE SELECTS ──────────────────────────────────────────────────────────
function populateSelects() {
  ['type1','type2'].forEach((id, idx) => {
    const sel = document.getElementById(id);
    TYPES.forEach((t, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = t.name + ' Souls';
      if (i === (idx === 0 ? 12 : 0)) opt.selected = true; // default: Andromedan + Siriusian
      sel.appendChild(opt);
    });
  });
}

populateSelects();
</script>
